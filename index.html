rom both armies rushing into the mouths of the figure like moths into a flame (11.29). Krishna says he is Time, the world-destroyer, grown to bring an end to these worlds, and that the warriors are already slain; Arjuna need only be the instrument (11.32\u201333).","Shaken, Arjuna begs Krishna to return to his human form. Krishna agrees, saying that this vision is rarely granted and that he can be known through undivided devotion."],variants:['The word kala in 11.32 can be translated as "Time" or "Death"; translators such as Miller (1986) and Sargeant (1984) choose differently, and the choice shapes how the verse is read.'],scholarship:"Scholars often treat Chapter 11 as the dramatic centre of the Gita, where the abstract teaching of the preceding chapters becomes a vision (Brockington 1998).",characters:["arjuna","krishna"],alsoAppearing:["Sanjaya"],places:["kurukshetra"],motif:"sun",themes:["Vision","Time","Awe"]},{epic:"bhagavad-gita",slug:"gunas-and-freedom",order:5,title:"The Gunas and Freedom",section:"Chapters 13\u201318",locator:"Bhagavad Gita 13\u201318",summary:"Krishna explains the three strands of nature and brings the dialogue to its close.",body:["Chapter 13 distinguishes the field, the body and its changes, from the knower of the field. Chapter 14 describes the three gunas, sattva, rajas and tamas, strands of nature that bind the embodied being through clarity, passion and inertia. Chapter 15 pictures the world as an inverted ashvattha tree to be cut by detachment. Chapters 16 and 17 describe divine and demonic dispositions and three kinds of faith, food, sacrifice and austerity.","Chapter 18 is a summary. It distinguishes renunciation of action from relinquishing its fruits and discusses the duties of different people according to their nature. Readers and communities differ in how they read this passage, which has been connected with the social order of varna; modern commentators, including critics, have read it with great care. The final instruction (18.66) asks Arjuna to give up all other dharmas and take refuge in Krishna alone.","Arjuna says his confusion is gone and that he will act as Krishna directs. Sanjaya concludes that wherever Krishna and Arjuna are, there will be good fortune, victory and justice."],variants:[`Verse 18.66 is read very differently. In Sri Vaishnavism it is the "final verse" (charama shloka) that teaches surrender to God. Shankara reads it as giving up all rites and actions and taking refuge in the one Self. Tilak, who stressed the Gita's teaching of action, read it as consistent with carrying on one's duties.`],scholarship:"Passages that speak of duty by birth have been the subject of lively discussion in modern scholarship and among Hindu thinkers. Reading them in the light of the rest of the Gita and the commentarial tradition is advisable (Miller 1986).",characters:["arjuna","krishna"],alsoAppearing:["Sanjaya","Dhritarashtra"],places:["kurukshetra"],motif:"wheel",themes:["Gunas","Duty","Surrender"]},{epic:"bhagavata-purana",slug:"gajendra",order:1,title:"Gajendra, King of Elephants",section:"Book 8, chapters 2\u20134",locator:"Bhagavata Purana 8.2\u20138.4",summary:"A crocodile seizes an elephant, and his cry of surrender brings Vishnu.",body:["On Mount Trikuta lives Gajendra, king of the elephants. Wearied by heat, he leads his herd into a lake, where a crocodile seizes his leg. The struggle lasts for a very long time. His family cannot help him and his strength fails.","Remembering a prayer from a previous life, when he was a king named Indradyumna, he lifts a lotus in his trunk and offers a hymn to the one refuge of all beings, the God who has no name or form. The gods, who see that the prayer is addressed to the supreme being himself, do not come. Vishnu arrives on Garuda, cuts the crocodile with his discus, and lifts the elephant.","The crocodile is revealed as a gandharva, Huhu, freed from a curse. Gajendra takes on a divine form and goes to Vishnu's abode."],variants:["In Sri Vaishnava tradition the story illustrates prapatti, complete surrender. Gajendra Moksha has been a favoured subject of Indian art, from a relief on the Gupta-period temple at Deogarh to later painted manuscripts."],scholarship:"The hymn is a good example of the Bhagavata Purana's blend of philosophical and devotional vocabulary (Bryant 2003; Debroy 2019).",characters:["vishnu"],alsoAppearing:["Gajendra","Huhu","Garuda"],places:[],motif:"waves",themes:["Surrender","Grace","Release"]},{epic:"bhagavata-purana",slug:"prahlada",order:2,title:"Prahlada and the Man-Lion",section:"Book 7, chapters 5\u201310",locator:"Bhagavata Purana 7.5\u20137.10",summary:"A child devoted to Vishnu defies his tyrant father, and Vishnu appears as Narasimha.",body:["The asura king Hiranyakashipu, who hates Vishnu for killing his brother, wins a boon from Brahma that makes him almost impossible to kill: not by day or night, indoors or out, by neither man nor beast. Emboldened, he oppresses the worlds.","His son Prahlada is devoted to Vishnu from childhood. Teachers fail to change his mind. Hiranyakashipu tries to have him killed with elephants, snakes, fire and poison, but Prahlada survives. He tells his classmates that devotion to God is the best goal of life, and need not wait for old age.","Challenged by his father to show that Vishnu is everywhere, even in a pillar, Prahlada says he is. Hiranyakashipu strikes the pillar, and Vishnu emerges as Narasimha, half man and half lion, and at twilight, on a threshold, tears him apart on his lap. Offered a boon, Prahlada asks to be free of the wish for boons."],variants:["The popular story of Holika, who sits in a fire with Prahlada and is burned, is tied to the festival of Holi. It is told in other texts and local traditions, not in the Bhagavata's own account."],scholarship:"The story is a classic example of the Puranic pattern of a boon that creates the problem solved by an avatar, and of devotion as stronger than power (Rocher 1986).",characters:["prahlada","vishnu","brahma"],alsoAppearing:["Hiranyakashipu","Hiranyaksha","Narasimha"],places:[],motif:"mace",themes:["Devotion","Tyranny","Boons"]},{epic:"bhagavata-purana",slug:"churning-of-the-ocean",order:3,title:"The Churning of the Ocean",section:"Book 8, chapters 5\u201312",locator:"Bhagavata Purana 8.5\u20138.12",summary:"Gods and asuras churn the ocean for the nectar of immortality; poison, treasures and the goddess Lakshmi emerge.",body:["The gods, weakened after a curse of the sage Durvasa, are advised by Vishnu to ally with the asuras and churn the ocean of milk for amrita, the nectar of immortality. Mount Mandara serves as the churning rod and the serpent Vasuki as the rope. Vishnu, as the tortoise Kurma, supports the mountain on his back.","The churning first yields a deadly poison. Shiva drinks it and holds it in his throat, which turns blue. Then come a series of treasures: the wish-granting cow, the elephant Airavata, a wish-fulfilling tree, celestial women, and Lakshmi, who chooses Vishnu. Finally Dhanvantari, the divine physician, emerges with the pot of nectar.","The asuras seize the nectar. Vishnu appears as the enchantress Mohini and, by guile, gives it to the gods. One asura, Rahu, disguises himself among them; the sun and moon reveal him and Vishnu cuts off his head. In tradition the immortal head is blamed for eclipses."],variants:["The lists and order of the treasures differ between the Mahabharata, Ramayana and Puranas. At Angkor Wat the churning is carved on a long relief of the twelfth century, with devas and asuras pulling the serpent."],scholarship:"The myth is one of the most widely represented in Hindu and Southeast Asian art. The long bas-relief at Angkor Wat is among its best-known depictions, and it is often cited as evidence of the shared Puranic culture of South and Southeast Asia.",characters:["vishnu","shiva","lakshmi"],alsoAppearing:["Vasuki","Rahu","Dhanvantari","Mohini","Durvasa"],places:["angkor-wat"],motif:"waves",themes:["Cooperation","Poison and nectar","Origins"]},{epic:"bhagavata-purana",slug:"krishna-is-born",order:4,title:"Krishna Is Born",section:"Book 10, chapters 1\u20133",locator:"Bhagavata Purana 10.1\u201310.3",summary:"Born in the prison of King Kamsa, Krishna is carried across the Yamuna to safety at Gokula.",body:["The earth, burdened by oppressive kings, appeals to Brahma, and the gods go to the ocean of milk, where they are told that Vishnu will descend. Devaki is married to Vasudeva. As the couple ride away, her cousin Kamsa, who is driving the chariot, hears a voice predicting that her eighth child will kill him. He imprisons them and kills their first six children.","The seventh is transferred to the womb of Rohini and is born as Balarama. At midnight the eighth child, Krishna, is born in the prison, first in a four-armed form and then, at his parents' request, as an ordinary baby. The guards fall asleep and the shackles open. Vasudeva carries the child across the flooded Yamuna, sheltered by the hood of the serpent Shesha, to Gokula, and exchanges him with the newborn daughter of Yashoda.","Kamsa tries to kill the girl. She slips from his hands and rises into the sky as a goddess, warning him that his destroyer lives elsewhere. In Gokula, Nanda and Yashoda celebrate the birth of a son."],variants:["For Gaudiya and other Vaishnava traditions Krishna is God himself; for others an avatar of Vishnu. The Bhagavata keeps both ideas in view by opening with the four-armed Vishnu form before showing a baby."],scholarship:"Book 10 is the fullest narrative of Krishna's life and its influence on Indian devotional poetry, painting and dance has been immense (Bryant 2003).",characters:["krishna","vishnu","brahma"],alsoAppearing:["Devaki","Vasudeva","Kamsa","Yashoda","Nanda","Balarama","Rohini"],places:["mathura-vrindavan"],motif:"flute",themes:["Birth","Protection","Providence"]},{epic:"bhagavata-purana",slug:"govardhana",order:5,title:"Lifting Govardhana",section:"Book 10, chapters 24\u201325",locator:"Bhagavata Purana 10.24\u201310.25",summary:"Krishna persuades the cowherds to honour their hill, and shelters them from Indra's storm.",body:["Krishna sees the cowherds of Vraja preparing their annual offering to Indra, lord of rain. He asks why. Their cattle depend on the pastures and the hill, he argues, and so it is the hill and the cattle that deserve honour. The community agrees, and offers its worship to Govardhana.","Indra, offended, sends a deluge. Krishna lifts Govardhana on the little finger of his left hand and holds it up like an umbrella for seven days, sheltering the people and the cattle.","Indra, shown the power of the child, comes to Krishna and praises him. The cow Surabhi bathes Krishna, and he is named Govinda."],variants:["Govardhan Puja or Annakut, held the day after Diwali, commemorates the event in many northern and western regions with mountains of food. Some modern scholars read the story as reflecting a shift from Vedic sacrifice to devotion and local worship."],scholarship:"Bryant (2003) notes how the story contrasts a ritual economy centred on the rain god with devotion to Krishna and a pastoral way of life.",characters:["krishna"],alsoAppearing:["Indra","Nanda","Surabhi"],places:["mathura-vrindavan"],motif:"mountain",themes:["Protection","Humility","Community"]},{epic:"bhagavata-purana",slug:"sudama",order:6,title:"Sudama Visits Krishna",section:"Book 10, chapters 80\u201381",locator:"Bhagavata Purana 10.80\u201310.81",summary:"A poor friend brings a handful of flattened rice to the king of Dwarka.",body:["Sudama, a poor Brahmin who studied alongside Krishna in the school of Sandipani, lives in great poverty. His wife urges him to ask his friend, now king of Dwarka, for help. He sets out with a small gift of flattened rice tied in a cloth.","Krishna greets him at once with affection. He washes his friend's feet, Rukmini fans him, and they remember their school days. Krishna takes the rice and eats a handful with delight. Sudama, embarrassed, cannot bring himself to ask for anything and leaves.","On returning home he finds his hut replaced by a palace and his family prosperous. He understands and remains humble, devoted to Krishna without attachment to the wealth."],variants:["The story, known as Kuchela in the South, is popular in Kerala and other regions, and its emphasis on friendship across wealth and rank has made it a favourite with modern retellers."],scholarship:"The episode is often presented as the Bhagavata's answer to the idea that devotion is paid for with grand offerings: the smallest gift, given with love, is received fully (cf. Gita 9.26).",characters:["krishna"],alsoAppearing:["Sudama","Rukmini","Sandipani"],places:["dwarka"],motif:"lotus",themes:["Friendship","Humility","Grace"]},{epic:"devi-mahatmya",slug:"madhu-and-kaitabha",order:1,title:"Madhu and Kaitabha",section:"Chapter 1",locator:"Devi Mahatmya 1 (Markandeya Purana 81)",summary:"A king and a merchant ask why they still love those who wronged them; the answer introduces the Goddess as Mahamaya.",body:["The text opens with a frame story. King Suratha, who has lost his kingdom through betrayal, and the merchant Samadhi, thrown out by his family, meet at the hermitage of the sage Medhas. Both are puzzled that they still feel affection for those who wronged them. Medhas explains that the goddess Mahamaya draws even the wise into attachment.","He tells how, at the end of a cosmic age, when Vishnu slept on the serpent Shesha in the waters, two demons, Madhu and Kaitabha, arose from his ear and threatened Brahma, who sat on the lotus in Vishnu's navel. Brahma praised Yoga Nidra, the goddess of sleep, to release Vishnu.","She withdrew, Vishnu woke and fought for five thousand years. The Goddess deluded the demons so that they offered Vishnu a boon, and he asked that they die by his hand. They asked that he kill them where the earth was not covered by water. He killed them on his thigh."],variants:["Other texts, including the Mahabharata, tell of Madhu and Kaitabha without giving the Goddess the central part. The Devi Mahatmya reframes the myth so that she is the power behind Vishnu's sleep and waking."],scholarship:"Coburn (1991) observes that the frame story establishes the Goddess as both the source of bondage and the means of liberation.",characters:["vishnu","brahma"],alsoAppearing:["Suratha","Samadhi","Medhas","Madhu","Kaitabha"],places:[],motif:"lotus",themes:["Delusion","Cosmic cycles","The Goddess"]},{epic:"devi-mahatmya",slug:"mahishasura",order:2,title:"Mahishasura",section:"Chapters 2\u20134",locator:"Devi Mahatmya 2\u20134 (Markandeya Purana 82\u201384)",summary:"The gods' combined energies take shape as a goddess who defeats the buffalo-demon.",body:["The buffalo-demon Mahishasura defeats Indra and the gods after a hundred-year war. The gods go to Vishnu and Shiva. Their anger and the radiant energies of all the gods combine into a blazing mass that takes the form of a goddess. Shiva's light forms her face, Vishnu's her arms, and each god gives a part.","The gods hand her their weapons: Shiva's trident, Vishnu's discus, and others. The Himalaya gives her a lion to ride. She laughs and roars. Mahishasura's armies attack and are destroyed. Mahishasura himself changes shape again and again, and she kills him as he emerges from his buffalo form.","The gods praise her in a hymn, and she promises to return whenever they are in need."],variants:["Images of the Goddess slaying Mahishasura (Mahishasuramardini) are known from early in the first millennium CE, with a famous Pallava relief at Mamallapuram of about the seventh century. Durga Puja in Bengal and Dasara at Mysuru draw on this episode."],scholarship:"Scholars read the episode as the Goddess's origin myth: she is formed from the gods' energies but proves more than their sum (Kinsley 1986).",characters:["vishnu","shiva","parvati"],alsoAppearing:["Mahishasura","Indra"],places:["kanyakumari"],motif:"trident",themes:["Divine power","Disorder","Victory"]},{epic:"devi-mahatmya",slug:"shumbha-and-nishumbha",order:3,title:"Shumbha and Nishumbha",section:"Chapters 5\u201313",locator:"Devi Mahatmya 5\u201313 (Markandeya Purana 85\u201393)",summary:"Kali and the Matrikas fight Raktabija and the two demon brothers; the many goddesses merge into one.",body:["The asura brothers Shumbha and Nishumbha conquer the gods, who go to the Himalaya and pray to the Goddess. From the body of Parvati, who has gone to bathe, emerges the goddess Kaushiki, also called Ambika. When Shumbha's messenger proposes marriage on his master's behalf, she replies that she has vowed to marry only the man who defeats her in battle.","Dhumralochana is reduced to ash by her sound. When Chanda and Munda attack, Kali springs from her frowning brow and kills them, earning the name Chamunda. The demon Raktabija can produce a copy of himself from each drop of his blood that touches the ground; Kali drinks the blood before it falls, and he is destroyed.","Nishumbha is killed. When Shumbha accuses her of relying on the strength of others, she answers that all of them are her own powers. The other goddesses, the Matrikas, enter her, and she slays Shumbha alone. The text ends with the blessings of reciting it, and Suratha and Samadhi, who worship the Goddess, regain their kingdom and wisdom."],variants:["Which goddess slays whom, and how many forms there are, varies in later traditions. In some tellings Kali is the Goddess's own anger; in others a separate goddess is invoked."],scholarship:"Coburn (1991) sees in this episode the text's central claim: the many goddesses are forms of a single supreme power. It is one of the earliest sustained statements of that idea in Sanskrit.",characters:["parvati","saraswati"],alsoAppearing:["Shumbha","Nishumbha","Raktabija","Chanda","Munda","Kali","Matrikas"],places:["kamakhya"],motif:"sun",themes:["Divine power","Unity","Liberation"]}]});function lr(a,e){switch(a){c
