2E\u093F\u0924\u094D\u0930",iast:"Vi\u015Bv\u0101mitra",category:"sage",summary:"A king who became a sage through austerity and who takes the young Rama to destroy rakshasas.",body:["Born a king, Vishvamitra attains the status of a Brahmin sage through years of penance. In the Ramayana's first book he asks Dasharatha for Rama, teaches him celestial weapons, and takes him to Mithila. The third book of the Rigveda is attributed to his family, including the Gayatri verse (3.62.10).","In the Mahabharata he is the father of Shakuntala by the apsara Menaka."],tags:["Sage","Ramayana","Vedic"],motif:"flame",related:["vasishtha","rama","ramayana"],appearsIn:[{epic:"ramayana",chapter:"birth-and-bow"}],sources:["rigveda-jb","goldman-ramayana"]},{slug:"adi-shankara",name:"Adi Shankara",native:"\u0906\u0926\u093F \u0936\u0919\u094D\u0915\u0930",iast:"\u015Aa\u1E45kara",category:"sage",summary:"The philosopher who gave Advaita Vedanta its classical form, traditionally dated to the eighth century CE.",body:["Shankara wrote commentaries on the Upanishads, the Brahma Sutras and the Bhagavad Gita arguing that the individual self and Brahman are ultimately one, and that the experience of difference is the work of ignorance. Tradition credits him with founding monasteries at Sringeri, Dwarka, Puri and Jyotirmath."],inScholarship:["His dates are debated, with many scholars placing him in the eighth century CE. Many works attributed to him are probably by later authors bearing the same name (Flood 1996; Radhakrishnan and Moore 1957)."],tags:["Philosopher","Advaita","Historical"],motif:"lotus",related:["atman","brahman","maya","bhagavad-gita"],sources:["flood-intro","radhakrishnan-moore","klostermaier-survey"]}]});var $i,jh=Ga(()=>{$i=[{slug:"dharma",name:"Dharma",native:"\u0927\u0930\u094D\u092E",iast:"Dharma",category:"concept",summary:"Order, duty and right conduct: that which upholds the world and the individual's place in it.",body:['The word comes from a root meaning "to hold" or "to support". It can mean cosmic order, law, duty, righteousness, or the proper nature of a thing. No single English word covers it.',"The Mahabharata treats dharma as subtle and sometimes in conflict with itself: the epic's characters repeatedly face choices where two duties collide."],inTexts:["The Rigveda uses dharman for something that supports or establishes. The Dharmashastras, legal and ethical treatises, set out duties by stage of life and social position. The Mahabharata and the Gita examine dharma as a question rather than only a rule."],inTradition:[`Hindu traditions distinguish duties that apply to everyone (honesty, nonviolence, compassion) from specific duties tied to one's situation (sva-dharma). Many communities now use "Sanatana Dharma" as a name for their tradition.`],inScholarship:["Historians note that Ashoka's edicts use the Prakrit dhamma for a public ethic, and that Buddhists and Jains also use the term in their own senses (Thapar 2002). The Mahabharata has been read as an extended meditation on how dharma can be known (Hiltebeitel 2001)."],tags:["Ethics","Law","Cosmic order"],motif:"wheel",related:["karma","moksha","yudhishthira","mahabharata","bhagavad-gita"],sources:["hiltebeitel-rethinking","thapar-early-india","flood-intro"]},{slug:"karma",name:"Karma",native:"\u0915\u0930\u094D\u092E",iast:"Karma",category:"concept",summary:"Action, and the principle that actions have consequences that shape one's future, including future lives.",body:['Karma literally means "action". It names both the deed and the moral consequence that follows from it. In the Gita, karma yoga is the discipline of acting without being bound by the desire for results.',"It is often misread as fate. In most Hindu schools it is a principle of moral causality in which present choices shape future conditions."],inTexts:["In the Brihadaranyaka Upanishad (4.4.5) a person is said to become according to how they act. The Gita (2.47) separates the right to act from any right to the fruits."],inScholarship:["Scholars trace the shift from Vedic ritual action to a moral law of rebirth to the centuries around the Upanishads and the rise of renunciant movements (Flood 1996)."],tags:["Ethics","Rebirth","Action"],motif:"wheel",related:["samsara","moksha","dharma","bhagavad-gita"],sources:["upanishads-olivelle","flood-intro","gita-miller"]},{slug:"samsara",name:"Samsara",native:"\u0938\u0902\u0938\u093E\u0930",iast:"Sa\u1E43s\u0101ra",category:"concept",summary:"The cycle of birth, death and rebirth in which beings are bound by karma.",body:['Samsara means "wandering through". Beings are born again and again in different forms, shaped by their actions and desires, until release (moksha) ends the cycle.',"Buddhists and Jains share the idea of samsara but understand its causes and the means of release differently."],inTexts:["The Katha and Brihadaranyaka Upanishads are early texts that describe rebirth and its link to action and knowledge."],inScholarship:["Historians see the doctrine settling during the centuries of the early Upanishads and the Shramana movements, as part of a shared milieu (Thapar 2002; Olivelle 1998)."],tags:["Rebirth","Cosmology"],motif:"wheel",related:["karma","moksha","atman"],sources:["upanishads-olivelle","thapar-early-india"]},{slug:"moksha",name:"Moksha",native:"\u092E\u094B\u0915\u094D\u0937",iast:"Mok\u1E63a",category:"concept",summary:"Liberation from the cycle of rebirth; the final goal in most Hindu traditions.",body:[`Moksha means "release". The ways it is described differ. In Advaita Vedanta it is the realisation that the Self is identical with Brahman. In Vaishnava traditions it is often life in God's presence in devoted service. Other schools have other emphases.`,"Moksha is one of the four traditional aims of life (purusharthas), alongside dharma, artha (prosperity) and kama (pleasure)."],inTradition:["Paths to moksha are traditionally described as knowledge, devotion and disciplined action, and many teachers combine them. Some traditions speak of jivanmukti, liberation while living."],tags:["Liberation","Goal of life"],motif:"lotus",related:["samsara","karma","atman","brahman","bhakti"],sources:["radhakrishnan-moore","michaels-hinduism"]},{slug:"atman",name:"Atman",native:"\u0906\u0924\u094D\u092E\u0928\u094D",iast:"\u0100tman",category:"concept",summary:"The Self: the inner, unchanging reality of a being, as distinct from body and mind.",body:["The Upanishads investigate the atman as the innermost self. The Brihadaranyaka Upanishad (1.4.10) has the Self know itself as Brahman, and the Chandogya Upanishad (6.8.7) teaches that the subtle essence of all things is the Self, which the student is.","The relationship of atman to Brahman is the great point of divergence among Vedanta schools: identical for Advaita, a part of God for Vishishtadvaita, and distinct for Dvaita."],inScholarship:["Buddhists, who teach non-self (anatta), argued against the Upanishadic idea of a permanent self, making the question central in Indian philosophical debate."],tags:["Philosophy","Upanishads","Vedanta"],motif:"lotus",related:["brahman","moksha","maya","adi-shankara"],sources:["upanishads-olivelle","radhakrishnan-moore"]},{slug:"brahman",name:"Brahman",native:"\u092C\u094D\u0930\u0939\u094D\u092E\u0928\u094D",iast:"Brahman",category:"concept",summary:"The ultimate reality of the Upanishads: the source and ground of all that exists.",body:["Brahman is not the creator god Brahma, nor a Brahmin. In the Upanishads it is the single reality underlying the world, and later Vedanta schools describe it in different ways: without qualities (nirguna) in Advaita, with qualities (saguna) and identified with God in Vaishnava and other traditions.","In the earliest Vedic usage brahman refers to a sacred formulation or power, and scholars see the later meaning as developing from it."],inTexts:["The Isha Upanishad opens by saying that all of this is pervaded by the Lord, and the Mundaka and Taittiriya Upanishads speak of Brahman as the source from which beings arise."],tags:["Philosophy","Upanishads","Absolute"],motif:"om",related:["atman","maya","brahma","adi-shankara"],sources:["upanishads-olivelle","radhakrishnan-moore","flood-intro"]},{slug:"maya",name:"Maya",native:"\u092E\u093E\u092F\u093E",iast:"M\u0101y\u0101",category:"concept",summary:'The power by which the one reality appears as many; often translated "illusion", though it means more.',body:["In the Rigveda maya is the wonder-working power of gods. The Shvetashvatara Upanishad (4.10) calls nature maya and the great Lord its wielder. In Advaita Vedanta, maya is the power by which Brahman appears as a world of distinct things.",'"Illusion" is a common but misleading translation. In many schools the world is real in some sense, and the issue is how we see it.'],inTradition:["Ramanuja and other Vedanta teachers criticised the Advaita view and held that the world is real and part of God's body. In devotional traditions maya is often the Goddess's delusive power, as in the Devi Mahatmya."],tags:["Philosophy","Vedanta","Goddess"],motif:"waves",related:["brahman","atman","adi-shankara","devi-mahatmya"],sources:["upanishads-olivelle","radhakrishnan-moore","coburn-encountering","zimmer-myths"]},{slug:"bhakti",name:"Bhakti",native:"\u092D\u0915\u094D\u0924\u093F",iast:"Bhakti",category:"concept",summary:"Loving devotion to God; both a path to liberation and a rich tradition of poetry, music and worship.",body:['Bhakti comes from a root meaning "to share in" or "to partake". The Shvetashvatara Upanishad (6.23) is among the earliest texts to use the word for devotion, and the Gita (Chapter 12) describes the devotee dear to God.',"From the sixth century CE the Tamil Alvars and Nayanars, singing of Vishnu and Shiva, began a poetry of devotion that spread across the subcontinent through poet-saints such as Basava, Kabir, Mirabai and Tukaram."],inScholarship:["Scholars note that bhakti movements often drew in people from many social backgrounds, including women, and wrote in regional languages rather than Sanskrit (Flood 1996)."],tags:["Devotion","Poetry","Practice"],motif:"flute",related:["moksha","krishna","prahlada","bhagavata-purana","bhagavad-gita"],sources:["flood-intro","bryant-krishna","gita-miller"]},{slug:"ahimsa",name:"Ahimsa",native:"\u0905\u0939\u093F\u0902\u0938\u093E",iast:"Ahi\u1E43s\u0101",category:"concept",summary:"Non-harm: the ethical principle of avoiding injury to living beings, in act, word and thought.",body:["Ahimsa is listed among virtues in the Chandogya Upanishad (3.17.4) and is the first of the restraints in Patanjali's Yoga Sutras. It is central in Jainism and Buddhism as well.","The Mahabharata contains repeated statements that nonviolence is the highest dharma, but also faces the tension between this ideal and the duties of a warrior and king. The Gita is often discussed in that light."],inScholarship:["Gandhi's modern reading of ahimsa as a political method drew on the Gita, Jain teachers and other sources, and has been influential worldwide, though not all Hindu thinkers have read the tradition in the same way."],tags:["Ethics","Yoga","Nonviolence"],motif:"lotus",related:["dharma","bhagavad-gita","mahabharata"],sources:["upanishads-olivelle","yoga-sutras","debroy-mahabharata"]},{slug:"avatara",name:"Avatara",native:"\u0905\u0935\u0924\u093E\u0930",iast:"Avat\u0101ra",category:"concept",summary:'"Descent": the appearance of a deity in the world, most often Vishnu, to restore dharma.',body:["The Gita (4.7\u20138) states the principle: when dharma declines, God manifests himself. The Puranas set out lists of avatars, most commonly ten: Matsya, Kurma, Varaha, Narasimha, Vamana, Parashurama, Rama, Krishna, the Buddha and Kalki. Some lists replace the Buddha with Balarama.","Shaiva and Shakta traditions speak of descents of Shiva and the Goddess as well, and Hanuman is regarded in some traditions as an avatar of Rudra."],inScholarship:["Scholars link the full avatar doctrine to the synthesis of Vaishnava streams around the turn of the common era (Flood 1996), and note that the inclusion of the Buddha in Vaishnava lists reflects relations between traditions."],tags:["Vaishnava","Theology"],motif:"conch",related:["vishnu","krishna","rama","yuga"],sources:["gita-miller","flood-intro","rocher-puranas"]},{slug:"yuga",name:"Yuga",native:"\u092F\u0941\u0917",iast:"Yuga",category:"concept",summary:"The four ages of the world's cycle: Krita (Satya), Treta, Dvapara and Kali, with dharma declining through each.",body:["In Puranic reckoning the four yugas together make a mahayuga of 4,320,000 years, and a thousand mahayugas make a kalpa, one day of Brahma. Dharma is said to stand on four legs in the first age and to lose one in each subsequent age. Tradition places the Ramayana in the Treta, the Mahabharata war at the end of the Dvapara, and our own era in the Kali Yuga, said to have begun in 3102 BCE.","These figures belong to a symbolic scheme of cosmic time. They should not be read as dates in history."],inTexts:["The Manusmriti (chapter 1) gives the yuga durations and the decline of dharma, and the Mahabharata (Vana Parva) has a long description of the ages given by the sage Markandeya."],inScholarship:["Scholars see the four-yuga doctrine developing in the late epic and early Puranic period. It has no connection with the historical chronology that archaeology and philology construct."],tags:["Cosmology","Time"],motif:"wheel",related:["avatara","brahma","ramayana","mahabharata"],sources:["rocher-puranas","brockington-epics","dimmitt-vanbuitenen"]}]});var At,Ho=Ga(()=>{At=[{slug:"varanasi",name:"Varanasi",alt:"Kashi, Banaras",region:"Uttar Pradesh, India",coords:{lat:25.32,lon:83.01},themes:["shaiva","tirtha"],summary:"The city of Shiva on the Ganga, where pilgrims bathe at dawn and cremations take place by day and night.",description:['Varanasi, also called Kashi, "the luminous", lies on the west bank of the Ganga. Its riverfront of ghats is the setting for daily bathing, worship and cremation. The Kashi Vishwanath temple holds one of the twelve jyotirlingas of Shiva.',`Tradition holds that dying here, or having one's ashes cast into the river, can bring release from rebirth. Diana Eck's study (1982) describes the city as a "crossing place" between the world and what lies beyond it.`],context:["Excavations at Rajghat indicate settlement in the first half of the first millennium BCE. Nearby Sarnath is where the Buddha gave his first sermon, and Varanasi has long been a centre of Sanskrit learning and music. The present Vishwanath temple is a rebuilding of the eighteenth century."],deities:["shiva","parvati"],epics:[],motif:"flame",sources:["eck-banaras","eck-sacred-geography","thapar-early-india"]},{slug:"ayodhya",name:"Ayodhya",region:"Uttar Pradesh, India",coords:{lat:26.8,lon:82.2},themes:["ramayana","vaishnava","tirtha"],summary:"The city on the Sarayu traditionally identified as Rama's capital, also holy to Jains and Buddhists.",description:["In the Ramayana, Ayodhya is the capital of the Ikshvaku kings of Kosala. Rama's birth, coronation and return from exile all take place there, and Ayodhya in tradition is the model of a well-ordered city.","Ayodhya is also revered by Jains as the birthplace of several tirthankaras, and its ancient settlement is linked by many scholars with the early historical city of Saketa."],context:["The site traditionally identified as Rama's birthplace was the subject of a long legal dispute, which the Supreme Court of India decided in 2019. A new temple was consecrated in January 2024. These developments are part of the modern history of the city, which readers may wish to research from several perspectives."],deities:["vishnu"],epics:["ramayana"],motif:"sun",sources:["goldman-ramayana","eck-sacred-geography","thapar-early-india"]},{slug:"mathura-vrindavan",name:"Mathura and Vrindavan",alt:"Braj",region:"Uttar Pradesh, India",coords:{lat:27.52,lon:77.68},themes:["vaishnava","mahabharata","tirtha"],summary:"The land of Krishna's birth and childhood on the Yamuna, an active centre of devotion for centuries.",description:["Tradition places Krishna's birth in Mathura and his childhood in Gokula and Vrindavan, across the Yamuna. The region, called Braj, is dotted with places linked to his life, among them Govardhana hill, which pilgrims circumambulate.","Vrindavan's present temple landscape grew especially from the sixteenth century, when Gaudiya Vaishnava teachers and royal patrons revived the sacred sites of Braj."],context:["Historically, Mathura was a major city in the early centuries CE, and the Mathura school of sculpture produced Buddhist, Jain and Hindu images from roughly the first to third centuries CE."],deities:["krishna","vishnu"],epics:["bhagavata-purana","mahabharata"],motif:"flute",sources:["eck-sacred-geography","bryant-krishna","hawley-butter-thief"]},{slug:"dwarka",name:"Dwarka",region:"Gujarat, India",coords:{lat:22.24,lon:68.97},themes:["vaishnava","mahabharata","tirtha"],summary:"The western seaside city traditionally founded by Krishna, one of the four Char Dham pilgrimage sites.",description:["The Bhagavata Purana and the Mahabharata describe Dwarka as the city Krishna built after leaving Mathura, which was submerged after the destruction of the Yadavas. The Dwarkadhish temple stands on the Gujarat coast; Bet Dwarka, an island offshore, is also honoured."],context:["Underwater and coastal surveys off Gujarat have been interpreted by some scholars as evidence of an ancient port. How these finds relate to the Dwarka of the epic is debated, and no consensus identifies them with the city of tradition."],deities:["krishna","vishnu"],epics:["mahabharata","bhagavata-purana"],motif:"waves",sources:["eck-sacred-geography","debroy-bhagavata"]},{slug:"kurukshetra",name:"Kurukshetra",region:"Haryana, India",coords:{lat:29.97,lon:76.84},themes:["mahabharata","tirtha"],summary:"The plain where the Mahabharata war is set and where, in tradition, the Gita was taught.",description:["The Gita begins by calling the battleground the field of dharma, Kurukshetra. Pilgrims visit Brahma Sarovar, a large tank, and Jyotisar, where tradition says Krishna spoke to Arjuna.","Kurukshetra was also a sacred area before the epic: Vedic ritual texts name it as a place for sacrifice, which suggests the epic's choice of setting reflects a place already marked as sacred."],context:["Historians do not treat the war as a datable event. The region was part of the Kuru and Painted Grey Ware cultures of the early first millennium BCE, and excavations in the area have been linked by some with the epic, though the identification is not established."],deities:["krishna"],epics:["mahabharata","bhagavad-gita"],motif:"chariot",sources:["mbh-critical","brockington-epics","eck-sacred-geography"]},{slug:"rameswaram",name:"Rameswaram",region:"Tamil Nadu, India",coords:{lat:9.29,lon:79.31},themes:["ramayana","shaiva","tirtha"],summary:"An island at the tip of the subcontinent, one of the Char Dham and a place of Shiva worship linked with Rama.",description:["Tradition says that Rama worshipped Shiva here before crossing to Lanka. The Ramanathaswamy temple holds one of the twelve jyotirlingas and is known for its long pillared corridors.","Nearby, a chain of limestone shoals stretches toward Sri Lanka. In tradition it is the remains of the bridge Rama's army built, and it is known as Rama Setu."],context:["Geologists describe the chain as a natural formation of shoals and sandbanks. Its sacredness for Hindus does not depend on that description, and the two are separate questions."],deities:["shiva","vishnu"],epics:["ramayana"],motif:"bridge",sources:["eck-sacred-geography","goldman-ramayana"]},{slug:"mount-kailash",name:"Mount Kailash",alt:"Kang Rinpoche",region:"Tibet Autonomous Region, China",coords:{lat:31.07,lon:81.31},themes:["shaiva"],summary:"The mountain that Hindus hold to be Shiva's abode, also sacred to Buddhists, Jains and Bon followers.",description:["Kailash, in the far west of Tibet, is the traditional home of Shiva and Parvati. Pilgrims circumambulate the mountain on a path of about fifty kilometres. Nearby Lake Manasarovar is also sacred.","Buddhists revere it as the abode of Demchok, Jains as the place where the first tirthankara attained liberation, and followers of Bon as a centre of their tradition. By tradition the peak is not climbed."],context:["Because several religions revere the same place in different ways, Kailash is a useful reminder that a sacred site is often shared."],deities:["shiva","parvati"],epics:[],motif:"mountain",sources:["eck-sacred-geography","kramrisch-siva"]},{slug:"haridwar",name:"Haridwar",region:"Uttarakhand, India",coords:{lat:29.95,lon:78.16},themes:["tirtha"],summary:"Where the Ganga leaves the mountains for the plains, and one of the four sites of the Kumbh Mela.",description:[`Haridwar, the "gateway" of Hari or Hara, lies where the Ganga enters the plain. Pilgrims bathe at Har ki Pauri, and each evening the Ganga Aarti, a ceremony of lamps, is held at the river's edge.`,"The Kumbh Mela is held in rotation at Haridwar, Prayagraj, Nashik and Ujjain, associated in tradition with drops of nectar from the churning of the ocean."],context:["The festival draws millions of people and is among the largest gatherings in the world."],deities:["shiva","vishnu"],epics:["bhagavata-purana"],motif:"waves",sources:["eck-sacred-geography"]},{slug:"prayagraj",name:"Prayagraj",alt:"Prayag, formerly Allahabad",region:"Uttar Pradesh, India",coords:{lat:25.43,lon:81.85},themes:["tirtha"],summary:"The confluence of the Ganga and Yamuna, where tradition places the invisible Sarasvati as well.",description:["At the Triveni Sangam the Ganga meets the Yamuna, and in tradition a hidden Sarasvati joins them. Prayag is praised in the Mahabharata's pilgrimage chapters, and the Kumbh Mela is held here, with the largest gatherings every twelve years."],context:["The city was named Allahabad for several centuries and officially renamed Prayagraj in 2018."],deities:["saraswati","vishnu"],epics:["mahabharata"],motif:"waves",sources:["eck-sacred-geography"]},{slug:"badrinath",name:"Badrinath",region:"Uttarakhand, India",coords:{lat:30.74,lon:79.49},themes:["vaishnava","tirtha"],summary:"A Himalayan shrine of Vishnu as Badrinarayan and the northern site of the Char Dham.",description:["The temple stands on the Alaknanda river, with Nilkantha peak above it. It is open only in the warmer half of the year, since snow closes the route in winter. The Mahabharata mentions a place called Badari as a sacred hermitage."],context:["Badrinath is one of the four Char Dham sites, with Dwarka, Puri and Rameswaram, which span the four directions of the subcontinent."],deities:["vishnu"],epics:["mahabharata"],motif:"mountain",sources:["eck-sacred-geography","debroy-mahabharata"]},{slug:"kedarnath",name:"Kedarnath",region:"Uttarakhand, India",coords:{lat:30.73,lon:79.07},themes:["shaiva","mahabharata","tirtha"],summary:"A jyotirlinga of Shiva high in the Himalaya, linked in tradition with the Pandavas.",description:["Tradition says the Pandavas came here after the war seeking Shiva's forgiveness, and that Shiva, disguised as a bull, sank into the ground, leaving his hump at Kedarnath. The temple is reached on foot or by helicopter and is closed in winter."],context:["The 2013 floods that devastated the valley are a reminder of the fragility of the Himalayan environment and of the pressures of pilgrimage tourism."],deities:["shiva"],epics:["mahabharata"],motif:"mountain",sources:["eck-sacred-geography","kramrisch-siva"]},{slug:"puri",name:"Puri",region:"Odisha, India",coords:{lat:19.81,lon:85.83},themes:["vaishnava","tirtha"],summary:"Home of Jagannath, whose wooden image is drawn on enormous chariots each year at the Rath Yatra.",description:["The Jagannath temple at Puri was built in the twelfth century under the Eastern Ganga dynasty. Its three principal images, Jagannath, Balabhadra and Subhadra, are made of wood and renewed periodically. Entry is restricted to Hindus.",`At the Rath Yatra the images are pulled in huge chariots to a temple a short distance away. The English word "juggernaut" comes from the god's name.`],context:["Many devotees regard Jagannath as a form of Krishna or Vishnu, and the tradition has absorbed Shaiva, Shakta and other elements. Puri is the eastern Char Dham."],deities:["krishna","vishnu"],epics:["bhagavata-purana"],motif:"chariot",sources:["eck-sacred-geography","eck-darsan"]},{slug:"tirumala",name:"Tirumala",alt:"Tirupati",region:"Andhra Pradesh, India",coords:{lat:13.68,lon:79.35},themes:["vaishnava"],summary:"The hill shrine of Venkateswara, a form of Vishnu, and one of the most visited pilgrimage sites in the world.",description:["On the Seshachalam hills stands the temple of Venkateswara, also called Balaji. Pilgrims often offer their hair as a sign of surrender and queue for hours to see the image.","The Tamil Alvar poets sang of Venkatam, and the temple is central to Sri Vaishnava tradition."],context:["The temple's long records of donations and inscriptions have made it an important source for the history of South Indian religion."],deities:["vishnu","lakshmi"],epics:[],motif:"conch",sources:["eck-darsan","klostermaier-survey"]},{slug:"madurai",name:"Madurai",region:"Tamil Nadu, India",coords:{lat:9.92,lon:78.12},themes:["shakta","shaiva","heritage"],summary:"The city of Meenakshi, a form of Parvati, whose temple towers rise over one of South India's oldest cities.",description:["The Meenakshi-Sundareshwarar temple is dedicated to Meenakshi, who is worshipped as a form of Parvati, and her husband Sundareshwarar, a form of Shiva. Its towers (gopuras) are covered with painted sculpture. The annual wedding festival draws large crowds."],context:["Madurai was a centre of Tamil literature in the Sangam period. The present temple complex largely dates to the Nayaka period (sixteenth to seventeenth centuries)."],deities:["parvati","shiva"],epics:[],motif:"lotus",sources:["kinsley-goddesses","hawley-wulff"]},{slug:"hampi",name:"Hampi",alt:"Vijayanagara, Pampa, Kishkindha",region:"Karnataka, India",coords:{lat:15.34,lon:76.46},themes:["ramayana","heritage"],summary:"The ruins of the Vijayanagara capital, set in a boulder landscape that tradition identifies with Kishkindha.",description:["Hampi was the capital of the Vijayanagara empire from the fourteenth to the sixteenth century. The Virupaksha temple has been in continuous worship, and the ruins of palaces and market streets are a UNESCO World Heritage Site.","Local tradition identifies the area around the Tungabhadra, ancient Pampa, with the vanara kingdom of Kishkindha in the Ramayana. Nearby sites are named for Sugriva, Vali and Hanuman's birthplace on Anjanadri hill."],context:["The identification of Ramayana sites with places on the map, here as elsewhere, is a feature of tradition and pilgrimage. Other regions also claim places from the epic."],deities:["hanuman","shiva"],epics:["ramayana"],motif:"mountain",sources:["unesco-whc","lutgendorf-hanuman","goldman-ramayana"]},{slug:"nashik",name:"Nashik and Panchavati",region:"Maharashtra, India",coords:{lat:20,lon:73.79},themes:["ramayana","tirtha"],summary:"A town on the Godavari with sites associated with Rama's exile, and one of the four Kumbh Mela cities.",description:[`Panchavati, on the Godavari, is where tradition places Rama, Sita and Lakshmana's forest hermitage and Shurpanakha's mutilation, hence the town's name, derived by some from "nose" (nasika). The Trimbakeshwar jyotirlinga is nearby and is the source of the Godavari in tradition.`],context:["Other regions of central and southern India also claim sites from Rama's exile in Dandaka forest."],deities:["shiva","vishnu"],epics:["ramayana"],motif:"tree",sources:["goldman-ramayana","eck-sacred-geography"]},{slug:"ujjain",name:"Ujjain",alt:"Avanti, Ujjayini",region:"Madhya Pradesh, India",coords:{lat:23.18,lon:75.78},themes:["shaiva","tirtha"],summary:"An ancient city on the Shipra, home of the Mahakaleshwar jyotirlinga and a Kumbh Mela site.",description:["Mahakaleshwar is one of the twelve jyotirlingas, and its daily ash-offering ritual is well known. Ujjain was the ancient city of Avanti and, in Indian astronomy, a reference point for a prime meridian.","Tradition connects the city with the legendary King Vikramaditya and the poet Kalidasa; historians treat these links with care."],context:["The Simhastha Kumbh Mela is held here every twelve years."],deities:["shiva"],epics:[],motif:"sun",sources:["eck-sacred-geography","thapar-early-india"]},{slug:"somnath",name:"Somnath",alt:"Prabhas Patan",region:"Gujarat, India",coords:{lat:20.89,lon:70.4},themes:["shaiva","heritage"],summary:"A coastal temple honoured as the first of the twelve jyotirlingas, with a long history of destruction and rebuilding.",description:["The temple at Prabhas Patan, on the Arabian Sea, is traditionally listed first among the jyotirlingas. The site was damaged and rebuilt many times; the present temple was completed in 1951."],context:['Medieval sources describe the attack on Somnath in 1025 CE. How the event has been remembered and used in later history is a subject of its own, studied by Romila Thapar in "Somanatha: The Many Voices of a History" (2004), which compares Sanskrit, Persian and other accounts.'],deities:["shiva"],epics:[],motif:"waves",sources:["eck-sacred-geography","thapar-early-india","thapar-somanatha"]},{slug:"thanjavur",name:"Thanjavur",region:"Tamil Nadu, India",coords:{lat:10.78,lon:79.13},themes:["shaiva","heritage"],summary:"The Chola capital whose Brihadisvara temple, consecrated about 1010 CE, is a masterpiece of Dravidian architecture.",description:["King Rajaraja I of the Chola dynasty built the Brihadisvara temple, dedicated to Shiva. Its granite tower rises about sixty-six metres, and the temple is a centrepiece of the UNESCO listing of the Great Living Chola Temples.","The Chola court also patronised the bronze casting that produced the classic Nataraja images."],context:["The temple's inscriptions record gifts, musicians and dancers attached to the temple, giving a detailed picture of temple life a thousand years ago."],deities:["shiva"],epics:[],motif:"trident",sources:["unesco-whc","kramrisch-siva","thapar-early-india"]},{slug:"konark",name:"Konark",region:"Odisha, India",coords:{lat:19.89,lon:86.09},themes:["heritage"],summary:"A thirteenth-century temple to the sun god Surya, conceived as a great stone chariot.",description:["The Sun Temple at Konark was built in the thirteenth century under the Eastern Ganga dynasty. It is designed as the chariot of Surya, with twenty-four huge carved wheels and horses. It is a UNESCO World Heritage Site."],context:["The wheels carry fine relief carving and also act as sundials in popular accounts."],deities:[],epics:[],motif:"sun",sources:["unesco-whc"]},{slug:"kamakhya",name:"Kamakhya",region:"Assam, India",coords:{lat:26.17,lon:91.7},themes:["shakta"],summary:"A hilltop temple at Guwahati, among the most important Shakti Pithas and a centre of Shakta and Tantric traditions.",description:["On Nilachal hill above the Brahmaputra, Kamakhya is honoured as the place where, in the Sati legend, the goddess's yoni fell. The sanctuary contains a stone worshipped as the goddess herself. The Ambubachi festival is a major annual gathering."],context:["Sircar (1973) shows that the lists of Shakti Pithas varied in number and location over time, and that Kamakhya appears in nearly all of them."],deities:["parvati"],epics:["devi-mahatmya"],motif:"lotus",sources:["sircar-sakta","kinsley-goddesses"]},{slug:"kanyakumari",name:"Kanyakumari",alt:"Cape Comorin",region:"Tamil Nadu, India",coords:{lat:8.08,lon:77.55},themes:["shakta","tirtha"],summary:"The southern tip of the subcontinent, where three seas meet and a virgin goddess is worshipped.",description:["The temple of Devi Kanyakumari stands at the meeting of the Arabian Sea, the Bay of Bengal and the Indian Ocean. In tradition the goddess performed austerities to marry Shiva, who never came, and so she remained a maiden. The place is counted among the Shakti Pithas in many lists."],context:["The Vivekananda Rock Memorial, built in 1970, stands on a rock offshore."],deities:["parvati"],epics:["devi-mahatmya"],motif:"waves",sources:["kinsley-goddesses","sircar-sakta"]},{slug:"pashupatinath",name:"Pashupatinath",region:"Kathmandu, Nepal",coords:{lat:27.71,lon:85.35},themes:["shaiva"],summary:"Nepal's foremost Shiva temple, on the Bagmati river, part of the Kathmandu Valley World Heritage Site.",description:['Pashupatinath honours Shiva as "lord of beasts". The main temple, rebuilt in the late seventeenth century on older foundations, stands beside the Bagmati, whose banks hold cremation ghats. Non-Hindus may view the complex from across the river but may not enter the main temple.'],context:["Nepal is the only country with a Hindu majority outside India, and its traditions of Shaivism blend with Buddhism in the Kathmandu Valley."],deities:["shiva"],epics:[],motif:"trident",sources:["unesco-whc","kramrisch-siva"]},{slug:"angkor-wat",name:"Angkor Wat",region:"Siem Reap, Cambodia",themes:["vaishnava","heritage","ramayana","mahabharata"],summary:"A twelfth-century Khmer temple to Vishnu, whose long galleries carry scenes from the epics and Puranas.",description:["King Suryavarman II built Angkor Wat in the early twelfth century as a temple to Vishnu. Its bas-reliefs include the churning of the ocean, a battle from the Mahabharata at Kurukshetra and a scene of the war in Lanka. In later centuries the temple became a Buddhist place of worship, as it is today."],context:["Angkor shows how Sanskrit literature and Hindu iconography were adopted and adapted by the Khmer court (Pollock 2006)."],deities:["vishnu"],epics:["ramayana","mahabharata","bhagavata-purana"],motif:"conch",sources:["unesco-whc","pollock-language"]},{slug:"prambanan",name:"Prambanan",region:"Central Java, Indonesia",themes:["shaiva","heritage","ramayana"],summary:"A ninth-century temple complex in Java, with Shiva, Vishnu and Brahma shrines and Ramayana reliefs.",description:["The Prambanan temples were built in the ninth century. The tallest shrine is dedicated to Shiva, flanked by those of Brahma and Vishnu. Relief panels around the temples tell the Ramayana, and the story is still performed in Javanese dance-drama."],context:["The Ramayana in Java took distinct forms, among them the Old Javanese Kakawin Ramayana, which differs from Valmiki in many details."],deities:["shiva","vishnu","brahma"],epics:["ramayana"],motif:"trident",sources:["unesco-whc","richman-many"]}]});var or,Uh=Ga(()=>{or=[{id:"t-kalpa",track:"traditional",order:1,dateLabel:"Cosmic cycles",title:"Kalpa and the four yugas",basis:"traditional",summary:"Puranic cosmology reckons time in vast cycles. Four yugas make a mahayuga of 4,320,000 years; a thousand mahayugas make a kalpa, a single day of Brahma.",evidence:"This is a symbolic scheme of cosmic time found in the Manusmriti and the Puranas. It is not a chronology that scholars try to fit onto archaeological dates, and the numbers should not be read as history.",links:[{label:"Yuga",href:"/explore/yuga"},{label:"Brahma",href:"/deities/brahma"}],sources:["rocher-puranas","dimmitt-vanbuitenen"],motif:"wheel"},{id:"t-satya",track:"traditional",order:2,dateLabel:"Satya (Krita) Yuga",title:"The age of truth",basis:"traditional",summary:"The first age, in which dharma stands on four legs. Vishnu's first four avatars, Matsya, Kurma, Varaha and Narasimha, are traditionally placed here, including Prahlada's story and the churning of the ocean.",evidence:"Placement of particular stories in particular yugas follows the Puranas and varies between texts. Traditional length: 1,728,000 years.",links:[{label:"Prahlada",href:"/epics/bhagavata-purana/prahlada"},{label:"The churning of the ocean",href:"/epics/bhagavata-purana/churning-of-the-ocean"}],sources:["rocher-puranas","debroy-bhagavata"],motif:"lotus"},{id:"t-treta",track:"traditional",order:3,dateLabel:"Treta Yuga",title:"The age of Rama",basis:"traditional",summary:"In the second age dharma stands on three legs. Vamana, Parashurama and Rama are placed here, and the Ramayana is set in this age.",evidence:"The Ramayana's own setting is the Treta Yuga. Traditional length: 1,296,000 years, which is why traditional reckonings put Rama's life hundreds of thousands of years in the past. Scholars do not treat the epic as a datable historical record.",links:[{label:"The Ramayana",href:"/epics/ramayana"},{label:"Rama",href:"/explore/rama"}],sources:["goldman-ramayana","rocher-puranas"],motif:"bow"},{id:"t-dvapara",track:"traditional",order:4,dateLabel:"Dvapara Yuga",title:"The age of Krishna",basis:"traditional",summary:"In the third age dharma stands on two legs. Krishna's avatar is placed here, and the Mahabharata describes its closing years.",evidence:"Traditional length: 864,000 years. The Mahabharata and the Bhagavata Purana place Krishna at the junction of this age and the next.",links:[{label:"The Mahabharata",href:"/epics/mahabharata"},{label:"Krishna",href:"/deities/krishna"}],sources:["mbh-critical","debroy-bhagavata"],motif:"flute"},{id:"t-war",track:"traditional",order:5,dateLabel:"Date of the war: traditional computations vary",title:"The Kurukshetra war",basis:"traditional",summary:"Traditional computations place the Bharata war about 36 years before the start of the Kali Yuga, giving a date near 3138 BCE. Other computations differ by centuries.",evidence:"An inscription at Aihole dated 634 CE counts years from the Bharata war, which shows how deeply the idea was embedded in the traditional calendar. Varahamihira's astronomical text gives a different reckoning, and modern scholars do not regard the war as a datable event. These are claims of traditional reckoning, not scientific dates.",links:[{label:"Eighteen Days at Kurukshetra",href:"/epics/mahabharata/eighteen-days"},{label:"Kurukshetra",href:"/explore/kurukshetra"}],sources:["mbh-critical","brockington-epics","thapar-early-india"],motif:"chariot"},{id:"t-kali",track:"traditional",order:6,dateLabel:"c. 3102 BCE (traditional epoch)",title:"The Kali Yuga begins",basis:"traditional",summary:"The fourth age, in which dharma stands on one leg, is traditionally said to begin when Krishna departs the world. Many Hindu calendars still count years from this epoch.",evidence:"3102 BCE is the epoch used by Indian astronomers such as Aryabhata, who recorded it in 499 CE. It is a calendrical convention rather than the date of an observed event. Traditional length of the age: 432,000 years.",links:[{label:"After the War",href:"/epics/mahabharata/after-the-war"},{label:"Yuga",href:"/explore/yuga"}],sources:["rocher-puranas","brockington-epics"],motif:"moon"},{id:"t-kalki",track:"traditional",order:7,dateLabel:"End of the Kali Yuga",title:"Kalki, the avatar to come",basis:"traditional",summary:"The Puranas foretell that Vishnu will appear as Kalki at the end of the present age to restore the cycle.",evidence:"This is a prophecy within the Puranic scheme, not a dated event. The Bhagavata Purana (Book 12) describes the end of the age.",links:[{label:"Avatara",href:"/explore/avatara"},{label:"Vishnu",href:"/deities/vishnu"}],sources:["debroy-bhagavata","rocher-puranas"],motif:"sun"},{id:"h-indus",track:"historical",order:1,dateLabel:"c. 2600\u20131900 BCE",title:"The mature Indus civilisation",basis:"estimate",summary:"Cities such as Mohenjo-daro and Harappa flourish in the Indus valley and beyond, with planned streets, drains and a script that has not been deciphered.",evidence:'Known from archaeology. Because the script is unread, whether and how Indus religion relates to later Hindu traditions is debated. Claims of continuity, for instance the "proto-Shiva" seal, remain unproven (Possehl 2002).',links:[{label:"Shiva",href:"/deities/shiva"}],sources:["possehl-indus","thapar-early-india"],motif:"waves"},{id:"h-rigveda",track:"historical",order:2,dateLabel:"c. 1500\u20131000 BCE",title:"The Rigveda is composed",basis:"estimate",summary:"The oldest Vedic collection, 1,028 hymns to gods such as Agni, Indra, Vishnu and Rudra, is composed in an early form of Sanskrit and transmitted orally.",evidence:"Dating rests on linguistic comparison and relative chronology, not on absolute dates, so the range is wide. The text was memorised for centuries before it was written down.",links:[{label:"Vishnu",href:"/deities/vishnu"},{label:"Saraswati",href:"/deities/saraswati"}],sources:["rigveda-jb","thapar-early-india"],motif:"flame"},{id:"h-upanishads",track:"historical",order:3,dateLabel:"c. 800\u2013500 BCE",title:"The early Upanishads",basis:"estimate",summary:"The earliest prose Upanishads, among them the Brihadaranyaka and Chandogya, explore the Self (atman), Brahman and rebirth.",evidence:"Olivelle (1998) places the earliest Upanishads before the rise of Buddhism, but exact dates are uncertain.",links:[{label:"Atman",href:"/explore/atman"},{label:"Brahman",href:"/explore/brahman"}],sources:["upanishads-olivelle"],motif:"om"},{id:"h-ashoka",track:"historical",order:4,dateLabel:"c. 268\u2013232 BCE",title:"Ashoka and the public ethic of dhamma",basis:"documented",summary:"The Mauryan emperor Ashoka has edicts engraved across the subcontinent urging nonviolence, tolerance and care for subjects, using the word dhamma, the Prakrit form of dharma.",evidence:"Documented in inscriptions. Ashoka's dhamma is a public ethic with Buddhist associations; it is related to but not identical with the Hindu concept of dharma.",links:[{label:"Dharma",href:"/explore/dharma"},{label:"Ahimsa",href:"/explore/ahimsa"}],sources:["thapar-early-india"],motif:"wheel"},{id:"h-epics",track:"historical",order:5,dateLabel:"c. 400 BCE\u2013400 CE",title:"The Sanskrit epics take shape",basis:"estimate",summary:"Over several centuries the Ramayana and the Mahabharata grow from older cores into roughly the forms we know today.",evidence:"Scholars date the older Ramayana core from perhaps the fifth century BCE and the Mahabharata's growth from about the fourth century BCE, with both texts revised for centuries (Brockington 1998). Estimates vary, with some scholars placing the beginnings earlier or later. Ranges, not single dates, are the honest answer.",links:[{label:"The Ramayana",href:"/epics/ramayana"},{label:"The Mahabharata",href:"/epics/mahabharata"}],sources:["brockington-epics","goldman-ramayana"],motif:"bow"},{id:"h-gita",track:"historical",order:6,dateLabel:"c. 200 BCE\u2013200 CE",title:"The Bhagavad Gita",basis:"estimate",summary:"The Gita is composed and set into the Bhishma Parva, joining Upanishadic, yogic and devotional ideas.",evidence:"Most scholars give a broad range around the turn of the era. The Besnagar pillar inscription (roughly the second to first century BCE), in which a Greek envoy honours Vasudeva, shows devotion to Krishna-Vasudeva was established by then.",links:[{label:"The Bhagavad Gita",href:"/epics/bhagavad-gita"}],sources:["flood-intro","brockington-epics","thapar-early-india"],motif:"chariot"},{id:"h-gupta",track:"historical",order:7,dateLabel:"c. 320\u2013550 CE",title:"The Gupta age and the Puranas",basis:"estimate",summary:"Temple building and sculpture mature, early Ganesha images appear, and the Puranas are redacted and expanded. Kalidasa is generally placed in this milieu.",evidence:"Dates of temples such as Deogarh and of individual Puranas are debated; Puranas were revised over centuries (Rocher 1986).",links:[{label:"Ganesha",href:"/deities/ganesha"},{label:"Vishnu",href:"/deities/vishnu"}],sources:["thapar-early-india","rocher-puranas","courtright-ganesa"],motif:"lotus"},{id:"h-bhakti",track:"historical",order:8,dateLabel:"c. 6th\u20139th century CE",title:"Tamil bhakti: Alvars and Nayanars",basis:"estimate",summary:"Poet-saints in the Tamil country sing of Vishnu and Shiva in their own language, launching a movement of devotional poetry that spreads across the subcontinent.",evidence:"The movement is dated by the poets' references and the temples they name. It influenced the Bhagavata Purana and later devotional traditions.",links:[{label:"Bhakti",href:"/explore/bhakti"},{label:"Madurai",href:"/explore/madurai"}],sources:["flood-intro","klostermaier-survey"],motif:"flute"},{id:"h-vedanta",track:"historical",order:9,dateLabel:"c. 8th\u201314th century CE",title:"Vedanta schools: Shankara, Ramanuja, Madhva",basis:"estimate",summary:"Shankara (traditionally eighth century), Ramanuja (eleventh to twelfth) and Madhva (thirteenth) argue different views of Brahman, the Self and God, in commentaries on the same texts.",evidence:"Dates are debated, especially for Shankara. All three comment on the Upanishads, the Brahma Sutras and the Gita.",links:[{label:"Adi Shankara",href:"/explore/adi-shankara"},{label:"Maya",href:"/explore/maya"}],sources:["flood-intro","radhakrishnan-moore"],motif:"om"},{id:"h-temples",track:"historical",order:10,dateLabel:"c. 1010 CE; early 12th century",title:"Temples from Thanjavur to Angkor",basis:"documented",summary:"The Brihadisvara temple at Thanjavur is completed under Rajaraja I about 1010 CE. In the early twelfth century Suryavarman II builds Angkor Wat in Cambodia.",evidence:"Documented by inscriptions and surviving monuments. Both sites are UNESCO World Heritage Sites, and Angkor's reliefs show the epics and Puranas as shared culture across South and Southeast Asia.",links:[{label:"Thanjavur",href:"/explore/thanjavur"},{label:"Angkor Wat",href:"/explore/angkor-wat"}],sources:["unesco-whc","pollock-language"],motif:"mountain"},{id:"h-manas",track:"historical",order:11,dateLabel:"1574 CE",title:"Tulsidas begins the Ramcharitmanas",basis:"documented",summary:"In Awadhi, a spoken language of northern India, Tulsidas retells the Ramayana, a work that will shape devotion to Rama and Hanuman and the tradition of Ramlila.",evidence:"The year is given by the poet in the text itself. The poem's reception is studied in Lutgendorf (1991).",links:[{label:"The Ramayana",href:"/epics/ramayana"},{label:"Hanuman",href:"/deities/hanuman"}],sources:["lutgendorf-life","hill-manas"],motif:"flame"},{id:"h-critical",track:"historical",order:12,dateLabel:"1933\u20131975 CE",title:"The critical editions",basis:"documented",summary:"Scholars at Pune complete the critical edition of the Mahabharata (1933\u20131966) and at Baroda the critical edition of the Valmiki Ramayana (1960\u20131975), comparing manuscripts from across the subcontinent.",evidence:"Documented by the editions themselves. They give the study of both epics a shared reference text, though they do not remove textual debate.",links:[{label:"The Mahabharata",href:"/epics/mahabharata"},{label:"Bibliography",href:"/about#bibliography"}],sources:["mbh-critical","ram-critical"],motif:"tree"}]});var uv,cv=Ga(()=>{uv=[{epic:"ramayana",slug:"birth-and-bow",order:1,title:"Birth, Bow and Marriage",section:"Bala Kanda",locator:"Valmiki Ramayana, Book 1",summary:"Four princes are born in Ayodhya; Rama guards a sage's sacrifice and wins Sita by bending the bow of Shiva.",body:["King Dasharatha of Kosala, who has no son, performs a great sacrifice. His three queens bear four sons: Rama to Kaushalya, Bharata to Kaikeyi, and the twins Lakshmana and Shatrughna to Sumitra. Rama and Lakshmana become inseparable, as do Bharata and Shatrughna.","The sage Vishvamitra asks that the boy Rama be sent to protect his rites from rakshasas. On the journey Rama overcomes the demoness Tataka, and at the hermitage of Gautama he meets Ahalya, who is released from her curse. Vishvamitra then takes the brothers to Mithila.","King Janaka of Mithila, who found his daughter Sita in a furrow while ploughing, offers her to the man who can string the great bow of Shiva that lies in his hall. Rama lifts and bends it until it breaks. The marriage follows, and on the way home the warrior-sage Parashurama confronts Rama, tests him and yields."],variants:["In Valmiki's text Ahalya is cursed to live unseen, fasting and lying in ashes, until Rama arrives; the better-known version in which she is turned to stone appears in later retellings."],scholarship:"Many scholars regard Books 1 and 7 as later additions to the older core of the epic. The Bala Kanda's presentation of Rama as an avatar of Vishnu is often cited as part of the evidence (Goldman 1984).",characters:["rama","sita","lakshmana","bharata","dasharatha","vishvamitra","vasishtha"],alsoAppearing:["Kaushalya","Kaikeyi","Sumitra","Shatrughna","Janaka","Tataka","Ahalya","Parashurama"],places:["ayodhya"],motif:"bow",themes:["Birth","Duty","Marriage"]},{epic:"ramayana",slug:"the-exile",order:2,title:"The Exile",section:"Ayodhya Kanda",locator:"Valmiki Ramayana, Book 2",summary:"On the eve of Rama's coronation, Kaikeyi claims two old boons: the throne for Bharata and fourteen years' exile for Rama.",body:["Dasharatha, ageing, decides to crown Rama. Ayodhya celebrates. Kaikeyi's maid Manthara then persuades her that Rama's rise will diminish Bharata. Kaikeyi demands the two boons the king once promised her: Bharata is to be crowned, and Rama is to live fourteen years in the forest.","Rama accepts without protest, for a son must honour his father's word. Sita and Lakshmana refuse to be left behind and go with him. Dasharatha, heartbroken, dies grieving for his son, saying his name.","Bharata, away at his mother's home, returns to find his father dead and his brother in exile. He rejects the throne and follows Rama into the forest to bring him back. Rama will not break his father's word. Bharata returns carrying Rama's sandals, places them on the throne, and rules from a village outside the city as a steward, waiting for Rama."],variants:["Kaikeyi is portrayed in many ways. In Valmiki she is swayed by Manthara but also acts with resolve; in Tulsidas's Ramcharitmanas the gods cloud the minds of Manthara and Kaikeyi so that the story can unfold; folk and modern retellings sometimes treat her with sympathy."],scholarship:"Scholars often point to this book as the emotional centre of the epic, where the ideal of duty is tested by its human cost.",characters:["rama","sita","lakshmana","bharata","dasharatha"],alsoAppearing:["Kaikeyi","Manthara","Kaushalya"],places:["ayodhya"],motif:"sun",themes:["Duty","Exile","Loyalty"]},{epic:"ramayana",slug:"the-golden-deer",order:3,title:"The Golden Deer",section:"Aranya Kanda",locator:"Valmiki Ramayana, Book 3",summary:"In the forest at Panchavati, Ravana lures Rama away with a magical deer and carries Sita off to Lanka.",body:["Rama, Sita and Lakshmana settle in a hermitage at Panchavati, by the Godavari. Shurpanakha, the sister of the rakshasa king Ravana, is drawn to Rama and, rejected, attacks Sita. Lakshmana wounds her. Her kinsman Khara attacks with an army and is defeated by Rama alone.","Shurpanakha goes to Ravana and tells him of Sita's beauty. Ravana enlists Maricha, who takes the shape of a golden deer. Sita asks for the deer, and Rama goes after it, leaving Lakshmana on guard. Struck by an arrow, Maricha cries out in Rama's voice. Sita, afraid, sends Lakshmana to help and speaks harshly to him. Ravana arrives disguised as an ascetic and carries her off in his flying chariot. The vulture Jatayu tries to stop him and is mortally wounded.","Rama and Lakshmana find the dying Jatayu, who tells them what happened, and Rama performs his funeral rites. They meet Kabandha and Shabari, who direct them to Sugriva, the exiled vanara king."],variants:[`The "Lakshmana Rekha", a line Lakshmana draws to protect Sita, is not in Valmiki's Sanskrit text. It appears in later retellings and has become one of the best-known images of the story.`,"In some later traditions, including the Adhyatma Ramayana and Tulsidas, the real Sita is hidden with Agni and a shadow-Sita is abducted."],scholarship:"Goldman and others point out that Valmiki's Sita speaks to Lakshmana with real anger. Later retellings often soften her words, one of many places where tellings reflect the values of their audiences (Ramanujan 1991).",characters:["rama","sita","lakshmana","ravana"],alsoAppearing:["Shurpanakha","Khara","Maricha","Jatayu","Kabandha","Shabari"],places:["nashik"],motif:"tree",themes:["Abduction","Desire","Loyalty"]},{epic:"ramayana",slug:"friends-in-kishkindha",order:4,title:"Friends in Kishkindha",section:"Kishkindha Kanda",locator:"Valmiki Ramayana, Book 4",summary:"Rama meets Hanuman and Sugriva, helps Sugriva regain his kingdom, and the search for Sita begins.",body:["On Mount Rishyamukha, Sugriva, exiled by his brother Vali, lives in hiding with a few companions. Hanuman, his minister, approaches Rama and Lakshmana disguised as an ascetic, and Rama admires his speech. The two sides make a pact before a fire: Rama will help Sugriva regain his kingdom and Sugriva will help find Sita.","While Vali and Sugriva fight, Rama shoots Vali from concealment. Dying, Vali challenges Rama: how could the hero of Ayodhya strike from hiding? Rama answers with arguments about kingship and about Vali's taking of his brother's wife. Vali accepts, and entrusts his son Angada to Sugriva.","When Sugriva delays, Lakshmana comes to him in anger. Search parties are sent in four directions. The southern party, led by Angada and Hanuman, learns from the vulture Sampati that Sita is held in Lanka, across the sea."],variants:["Tulsidas presents the episode with more reverence for Rama; other regional versions, such as Kamban's Tamil Ramayana, treat Vali more sympathetically. Ramanujan (1991) notes that every telling answers the questions the Valmiki text leaves open."],scholarship:"The Vali episode is one of the most discussed in Ramayana scholarship because it makes the epic's hero answer, inside the poem, for an act many readers find difficult.",characters:["rama","lakshmana","hanuman"],alsoAppearing:["Sugriva","Vali","Tara","Angada","Jambavan","Sampati"],places:["hampi"],motif:"mountain",themes:["Friendship","Justice","Alliance"]},{epic:"ramayana",slug:"leap-across-the-ocean",order:5,title:"The Leap Across the Ocean",section:"Sundara Kanda",locator:"Valmiki Ramayana, Book 5",summary:"Hanuman crosses the sea to Lanka, finds Sita in the Ashoka grove, and returns after setting the city alight.",body:["The search party stands on the shore, unable to cross the hundred leagues of the sea. The bear Jambavan reminds Hanuman of his powers. Hanuman grows to a vast size and leaps from Mount Mahendra. On the way he is tested by the mountain Mainaka, who rises from the sea to offer him rest, by the serpent-mother Surasa, and by Simhika, who tries to seize his shadow.","In Lanka he searches the city by night until he finds Sita in the Ashoka grove, thin and guarded by rakshasis. He gives her Rama's ring and receives her jewel as a token. She declines his offer to carry her back, saying that Rama himself must come and win her back.","Hanuman destroys the grove and is captured by Ravana's son Indrajit. He speaks before Ravana as Rama's envoy. Ravana orders his tail set alight, and Hanuman leaps from roof to roof, burning much of Lanka, then crosses the sea again to report."],variants:["The well-known image of Hanuman tearing open his chest to show Rama and Sita in his heart comes from later devotional tradition, not from Valmiki's text."],scholarship:'The Sundara Kanda ("the beautiful book") is often read as the poetic high point of the epic. Lutgendorf (2007) notes that the Hanuman here is a brilliant envoy rather than yet a god in his own right.',characters:["hanuman","sita","ravana","rama"],alsoAppearing:["Jambavan","Mainaka","Surasa","Simhika","Indrajit"],places:["rameswaram"],motif:"waves",themes:["Courage","Devotion","Messenger"]},{epic:"ramayana",slug:"the-war-for-lanka",order:6,title:"The War for Lanka",section:"Yuddha Kanda",locator:"Valmiki Ramayana, Book 6",summary:"A bridge is built, Vibhishana changes sides, Ravana is defeated, and Rama and Sita return to Ayodhya.",body:["The vanara army assembles at the sea. Ravana's brother Vibhishana, who had urged him to return Sita, leaves Lanka and joins Rama, although some of Sugriva's counsellors distrust him. Rama accepts him. After Rama prays to the ocean, the vanara engineer Nala builds a bridge, the Setu, across the strait.","The battle is long. Indrajit binds Rama and Lakshmana with serpent arrows until Garuda frees them. Kumbhakarna, the giant brother of Ravana, is woken and kills many before Rama slays him. Lakshmana kills Indrajit. When Lakshmana falls to a spear, Hanuman brings a mountain of healing herbs from the Himalaya.","Rama and Ravana fight, and Ravana is killed. Vibhishana is crowned. Sita is brought before Rama, who receives her coldly, saying he fought to restore his honour. She enters a fire to prove her purity and emerges unharmed. They return to Ayodhya in the flying chariot Pushpaka, and Rama is crowned."],variants:["In some later versions, including Tulsidas's, the fire trial reveals that only a shadow-Sita was in Lanka. In Jain tellings it is Lakshmana, not Rama, who kills Ravana, because Rama is committed to nonviolence.","Ravana is a tyrant in Valmiki's account; in many later and regional tellings he is also a great scholar and a devotee of Shiva."],scholarship:"Ramanujan (1991) takes the fire trial as an example of how tellings answer one another: Valmiki's Rama is troubled by honour, Tulsidas's by avoiding any stain on Sita, a Jain Rama by the question of violence.",characters:["rama","sita","lakshmana","ravana","vibhishana","hanuman"],alsoAppearing:["Sugriva","Angada","Nala","Kumbhakarna","Indrajit","Jambavan"],places:["rameswaram"],motif:"bridge",themes:["War","Justice","Return"]},{epic:"ramayana",slug:"rule-doubt-and-departure",order:7,title:"Rule, Doubt and Departure",section:"Uttara Kanda",locator:"Valmiki Ramayana, Book 7",summary:"Rama's reign is remembered as an age of peace, but the later book tells of Sita's exile and of Rama's departure from the world.",body:[`The Uttara Kanda ("the later book") begins with older stories about Ravana's family and his boon from Brahma, and the story of Hanuman's childhood. It then returns to Rama's reign, remembered in tradition as Rama-rajya, an ideal age of peace and justice.`,"In Valmiki's text, rumours spread in Ayodhya about Sita's time in Ravana's house. Rama, conscious of his subjects' opinion, sends the pregnant Sita into exile. Lakshmana leaves her at the hermitage of Valmiki, where she gives birth to twin sons, Lava and Kusha.","Years later the boys sing the Ramayana at Rama's horse sacrifice. Rama recognises them as his sons and asks Sita to prove her purity once more. She calls on the earth, her mother, who opens and receives her. Rama, grieving, hands over the kingdom and eventually walks into the Sarayu river, returning to his divine nature."],variants:["Many traditions respond critically to Rama's treatment of Sita here. Women's songs in Telugu, Bengali and other languages retell the story from Sita's point of view, and some retellings omit the exile altogether. Tulsidas's Ramcharitmanas has an Uttarakanda but ends with Rama's rule and philosophical dialogue, not Sita's exile."],scholarship:"Most scholars regard this book as a later addition to the epic (Goldman, Introduction to Book 7). Its moral difficulties are a major reason the book is read differently by different communities.",characters:["rama","sita","lakshmana","valmiki","hanuman"],alsoAppearing:["Lava","Kusha","Shatrughna"],places:["ayodhya"],motif:"waves",themes:["Kingship","Justice and gender","Departure"]}]});var dv,mv=Ga(()=>{dv=[{epic:"mahabharata",slug:"the-kuru-house",order:1,title:"The Kuru House",section:"Adi Parva",locator:"Mahabharata, Book 1",summary:"From Shantanu and Bhishma's vow to the birth of the Pandavas and Kauravas, their rivalry, and Draupadi's marriage.",body:["King Shantanu loves the river goddess Ganga, who bears his sons and drowns seven; the eighth, Devavrata, survives. When Shantanu later wishes to marry Satyavati, her father demands that her sons inherit the throne. Devavrata renounces both throne and marriage. For this terrible vow he is named Bhishma.","Satyavati's son Vichitravirya dies childless, and by custom the sage Vyasa, Satyavati's son from before her marriage, fathers sons on the widows: the blind Dhritarashtra, the pale Pandu, and Vidura. Pandu, cursed to die if he embraces his wife, lets Kunti call upon gods for children: Dharma gives Yudhishthira, Vayu gives Bhima and Indra gives Arjuna. Madri bears Nakula and Sahadeva by the Ashvins. Gandhari bears a hundred sons, the eldest Duryodhana. Before her marriage Kunti had also borne Karna to the sun god, and set him adrift; he is raised by a charioteer.","After Pandu's death the five brothers grow up in Hastinapura beside their cousins. Drona trains them all. Karna appears at a tournament and Duryodhana makes him king of Anga. Duryodhana's attempt to burn the Pandavas in a house of lacquer fails. Arjuna wins Draupadi at her svayamvara, and she becomes the wife of all five. Dhritarashtra divides the kingdom and the Pandavas found Indraprastha."],variants:["Some manuscript traditions open the epic with a story in which Ganesha writes it down as Vyasa dictates. The critical edition does not include it in the main text (see Ganesha)."],scholarship:"The text spends considerable effort justifying Draupadi's marriage to five men through a previous-life boon, an argument from Vyasa, and precedents. Scholars read this as a sign that the epic is explaining an unusual tradition to its audience.",characters:["bhishma","vyasa","kunti","karna","duryodhana","yudhishthira","bhima","arjuna","draupadi"],alsoAppearing:["Shantanu","Ganga","Satyavati","Dhritarashtra","Gandhari","Pandu","Madri","Vidura","Drona"],places:[],motif:"tree",themes:["Lineage","Rivalry","Vows"]},{epic:"mahabharata",slug:"the-dice-game",order:2,title:"The Dice Game",section:"Sabha Parva",locator:"Mahabharata, Book 2",summary:"Yudhishthira loses his kingdom, brothers and wife in a rigged game of dice. Draupadi's question is never answered.",body:["At Indraprastha, the architect Maya builds the Pandavas an assembly hall of illusions. Yudhishthira performs the Rajasuya, the ritual of imperial consecration, at which Krishna is honoured first and kills Shishupala when he insults him. Duryodhana, who mistakes floor for water and is laughed at, burns with envy.","Duryodhana and his uncle Shakuni plot a game of dice. Yudhishthira, bound by custom not to refuse an invitation, plays against the skilled and cheating Shakuni. He stakes and loses his wealth, his kingdom, his brothers, himself, and finally Draupadi.","Draupadi is dragged into the hall and asks whether a man who had already lost himself could stake her. No one in the assembly can answer. Dushasana tries to strip her; her garment is saved, in many tellings by Krishna. Bhima vows to break Duryodhana's thigh and drink Dushasana's blood. Dhritarashtra undoes some of the damage, but a second game follows and the Pandavas are sent into twelve years of forest exile, followed by a year in disguise."],variants:["The miracle of the endless cloth and the part Krishna plays in it differ between manuscripts and retellings."],scholarship:"Draupadi's question about whether Yudhishthira had the right to stake her is among the most discussed passages of the epic. Scholars read it as a deliberate challenge to the idea that dharma can be settled by rule (Hiltebeitel 2001).",characters:["yudhishthira","draupadi","duryodhana","bhima","krishna","karna"],alsoAppearing:["Shakuni","Dushasana","Maya","Dhritarashtra","Vidura","Shishupala"],places:[],motif:"dice",themes:["Dharma","Justice and gender","Fate"]},{epic:"mahabharata",slug:"years-in-the-forest",order:3,title:"Years in the Forest",section:"Vana Parva",locator:"Mahabharata, Book 3",summary:"Twelve years of exile: stories, pilgrimage, Arjuna's quest for weapons, a meeting with Hanuman, and the Yaksha's questions.",body:["The Pandavas and Draupadi spend twelve years in the forests, visiting sacred fords while sages tell stories to console them, among them Nala and Damayanti, Savitri and Satyavan, and a short version of the Ramayana. Draupadi and Bhima urge Yudhishthira to fight at once; he insists on keeping his word.","Arjuna goes north to the Himalaya for divine weapons. He fights a hunter who is Shiva in disguise and receives the Pashupata weapon, then visits Indra's heaven. Meanwhile Bhima, looking for a flower Draupadi has asked for, finds an old monkey lying across the path who says he is too weak to move his tail. Bhima cannot lift it, and the monkey reveals himself as Hanuman, his half-brother, born of the same father, Vayu.","Near the end of the exile four brothers die after drinking from a pool guarded by a Yaksha. Yudhishthira answers the Yaksha's questions about dharma and is allowed to revive one brother. He chooses Nakula, so that both Kunti's and Madri's lines survive. The Yaksha, who is Dharma, his father, revives them all."],variants:["The Yaksha's questions and Yudhishthira's answers are among the most quoted passages in the epic; popular retellings often compress them into a short list."],scholarship:"The Vana Parva is one of the longest books and holds many inset stories. Scholars treat the inset tales as commentary on the main plot, offering other examples of lost kingdoms, endurance and fidelity.",characters:["yudhishthira","bhima","arjuna","draupadi","hanuman","shiva"],alsoAppearing:["Nakula","Sahadeva","Indra","The Yaksha (Dharma)"],places:[],motif:"tree",themes:["Exile","Endurance","Dharma"]},{epic:"mahabharata",slug:"a-year-in-disguise",order:4,title:"A Year in Disguise",section:"Virata Parva",locator:"Mahabharata, Book 4",summary:"The Pandavas serve at the court of King Virata under false names for the thirteenth year.",body:["For the thirteenth year the Pandavas must live unrecognised or face another exile. They enter the service of King Virata of Matsya. Yudhishthira serves as a courtier and dice companion, Bhima as a cook, Arjuna as a dance and music teacher living as Brihannala, Nakula as a groom, Sahadeva as a cowherd, and Draupadi as a maid to the queen.","Kichaka, the queen's brother and Virata's general, pursues Draupadi. When she appeals to Bhima, he kills Kichaka in secret.","The Kauravas raid Virata's cattle, thinking to flush out the Pandavas. Prince Uttara takes Brihannala as his charioteer; Arjuna retrieves his weapons from a shami tree where the brothers had hidden them and defeats the Kaurava army. The Pandavas' identities are revealed. Virata offers his daughter Uttara to Arjuna, who accepts her as a wife for his son Abhimanyu."],variants:["The Kauravas argue that the thirteenth year was not complete when Arjuna was recognised; Bhishma's calculation says it was. Retellings often skip the dispute."],scholarship:"Virata Parva is often described as lighter in tone, with disguises and reversals of status, a pause before the war begins.",characters:["yudhishthira","bhima","arjuna","draupadi","bhishma"],alsoAppearing:["Virata","Kichaka","Uttara","Nakula","Sahadeva","Abhimanyu"],places:[],motif:"chariot",themes:["Disguise","Endurance","Justice"]},{epic:"mahabharata",slug:"the-failed-embassy",order:5,title:"The Failed Embassy",section:"Udyoga Parva",locator:"Mahabharata, Book 5",summary:"Krishna goes to Hastinapura to ask for peace and fails; Karna learns who he is and does not change sides.",body:["Both sides seek allies. Krishna offers Arjuna and Duryodhana a choice: his army, or himself, unarmed and not fighting. Arjuna chooses Krishna; Duryodhana is glad to have the army.","Krishna goes to Hastinapura as the Pandavas' envoy, asking for only five villages. Duryodhana refuses even land the size of a needle's point and tries to seize Krishna. Krishna reveals a vision of his cosmic form in the assembly hall.","Krishna then meets Karna and tells him he is Kunti's eldest son and therefore the Pandavas' brother, offering him a kingdom. Karna refuses, saying he owes Duryodhana his loyalty. Kunti herself approaches Karna later; he promises that of her five sons he will fight only Arjuna. Both armies assemble at Kurukshetra."],variants:["Popular retellings sometimes move Karna's revelation to the eve of battle or to Kunti alone; the critical text places Krishna's conversation first."],scholarship:"The scene sets up the epic's tragic structure: every character who might prevent the war refuses for reasons that seem like honour (Sukthankar 1957).",characters:["krishna","duryodhana","kunti","karna","arjuna","yudhishthira","bhishma"],alsoAppearing:["Dhritarashtra","Vidura","Dhrishtadyumna"],places:[],motif:"chariot",themes:["Diplomacy","Loyalty","Fate"]},{epic:"mahabharata",slug:"the-battlefield-opens",order:6,title:"The Battlefield Opens",section:"Bhishma Parva",locator:"Mahabharata, Book 6",summary:"Arjuna lays down his bow; Krishna speaks. Then ten days of fighting under Bhishma end with his fall.",body:["As the armies face each other, Arjuna asks Krishna, his charioteer, to draw the chariot between them. Seeing teachers and kinsmen on the other side, he sets down his bow. Krishna's reply is the Bhagavad Gita, which has a section of its own in this archive.","Bhishma commands the Kaurava army for ten days and causes enormous losses. The Pandavas go to him by night and ask how he can be defeated. He tells them he will not fight one who was born female, meaning Shikhandi.","On the tenth day Arjuna, shooting from behind Shikhandi, brings Bhishma down. He lies on a bed of arrows and, having the boon of choosing his death, waits for the sun's northward turn."],variants:["Shikhandi is understood in the text as a reincarnation of Amba, a princess wronged by Bhishma; later tellings, performance traditions and modern authors read this story in many ways, including as an early treatment of gender and identity."],scholarship:"The placement of the Gita here is a long-debated question. Some scholars treat it as an insertion; others argue it is integral to the epic's reflection on war (Brockington 1998; Hiltebeitel 2001).",characters:["arjuna","krishna","bhishma","duryodhana"],alsoAppearing:["Shikhandi","Sanjaya","Dhritarashtra"],places:["kurukshetra"],motif:"wheel",themes:["War","Duty","Death"]},{epic:"mahabharata",slug:"eighteen-days",order:7,title:"Eighteen Days at Kurukshetra",section:"Drona, Karna and Shalya Parvas",locator:"Mahabharata, Books 7\u20139",summary:"The war grows more brutal: Abhimanyu's death, the fall of Drona and Karna, and Duryodhana's end.",body:["Under Drona, the Kauravas form the spiral chakravyuha. Abhimanyu, Arjuna's young son, knows how to enter it but not how to leave. He breaks in and is surrounded by several warriors who attack him together, against the rules, and kills him. Arjuna vows to kill Jayadratha before sunset on the next day.",`The war loses its restraints. Drona is killed after Yudhishthira's half-truth that "Ashvatthama is dead", said of an elephant of that name. Karna, now commander, faces Arjuna; his chariot wheel sinks into the mud and he appeals to dharma. Krishna reminds him of the dice game and of Abhimanyu, and Arjuna kills him.`,"On the last day Duryodhana hides in a lake. Challenged by Bhima, he fights with maces. Bhima strikes him below the waist, against the rules of mace combat, and he falls with a broken thigh."],variants:["The epic lets its characters question these acts. Traditions justify them in different ways, as necessary, as a result of Kaurava crimes, or as the cost of a war without rules."],scholarship:"The books on the war present victory without triumph. Several scholars have observed how the text increasingly presents the Pandava victories as won by deceit endorsed by Krishna, which sharpens the epic's moral questions (Hiltebeitel 2001).",characters:["arjuna","karna","duryodhana","bhima","yudhishthira","krishna"],alsoAppearing:["Abhimanyu","Drona","Jayadratha","Ashvatthama","Shalya"],places:["kurukshetra"],motif:"chariot",themes:["War","Honour","Deceit"]},{epic:"mahabharata",slug:"after-the-war",order:8,title:"After the War",section:"Sauptika to Svargarohana Parvas",locator:"Mahabharata, Books 10\u201318",summary:"Grief, Bhishma's teaching, the end of the Yadavas, and the Pandavas' final journey.",body:["That night, Drona's son Ashvatthama kills the sleeping sons of Draupadi in the Pandava camp. In the Stri Parva, Gandhari, mourning her hundred sons, curses Krishna: his own clan will perish. Yudhishthira, crowned, is overwhelmed by remorse and wishes to renounce the throne.","On his bed of arrows Bhishma teaches Yudhishthira about the duties of a king and the path to release, in the long Shanti Parva. Yudhishthira rules for thirty-six years. The Yadavas then destroy themselves in a drunken brawl, and Krishna dies when a hunter's arrow strikes his foot.","The Pandavas hand the throne to Parikshit, Abhimanyu's son, and set out north with a dog. One by one Draupadi, Sahadeva, Nakula, Arjuna and Bhima fall. Only Yudhishthira and the dog reach the gate of heaven. Indra says the dog must remain outside; Yudhishthira refuses to enter without it. The dog is revealed as Dharma, and Yudhishthira, tested, is reunited with his family."],variants:["Readers disagree whether the epic's ending affirms compassion as the highest dharma or leaves its tensions unresolved. The text itself closes without easy consolation."],scholarship:"The Shanti and Anushasana Parvas hold much of the epic's didactic material and make the Mahabharata a handbook of law and politics as well as a war story (Brockington 1998).",characters:["yudhishthira","draupadi","bhishma","krishna","arjuna","bhima"],alsoAppearing:["Gandhari","Ashvatthama","Parikshit","Nakula","Sahadeva"],places:["dwarka","kurukshetra"],motif:"flame",themes:["Grief","Dharma","Departure"]}]});var fv,pv=Ga(()=>{fv=[{epic:"bhagavad-gita",slug:"arjuna-despairs",order:1,title:"Arjuna Despairs",section:"Chapters 1\u20132",locator:"Bhagavad Gita 1\u20132",summary:"Arjuna sees his kin on the other side and lays down his bow. Krishna begins by teaching about the Self.",body:["The blind king Dhritarashtra asks Sanjaya what has happened at Kurukshetra. Sanjaya, given divine sight, describes the armies sounding their conches. Arjuna asks Krishna, his charioteer, to take the chariot between the two forces. Seeing teachers, uncles and cousins in both lines, he feels his limbs fail, his mouth go dry, and sits down in the chariot, setting aside his bow. He says he sees no good in killing his own people.","Krishna answers first with a rebuke for faint-heartedness, then with teaching. The Self, he says, is neither slain nor does it slay; bodies are like worn garments, cast off for new ones. A warrior has no higher good than a just battle. He then introduces the yoga of understanding: act, but without attachment to the fruit.","Chapter 2 closes with a portrait of the person of steady wisdom (sthitaprajna), who is not shaken by pleasure or pain, who has withdrawn the senses as a tortoise withdraws its limbs, and who finds peace."],variants:[`Whether Krishna's "you must fight" justifies war or teaches duty in one specific situation has long been debated. Gandhi read the battlefield as an allegory for the struggle within and held that the Gita taught selfless action, not violence; Shankara took the opening as a lesson in discriminating the Self from the body.`],scholarship:"Scholars note that the Gita's setting, a pause between two armies, is part of its argument: the questions it raises about duty and violence are posed at the moment they cannot be avoided (Miller 1986).",characters:["arjuna","krishna"],alsoAppearing:["Sanjaya","Dhritarashtra"],places:["kurukshetra"],motif:"chariot",themes:["Doubt","Duty","The Self"]},{epic:"bhagavad-gita",slug:"action-without-attachment",order:2,title:"Action Without Attachment",section:"Chapters 3\u20136",locator:"Bhagavad Gita 2.47, 3\u20136",summary:"Krishna explains how to act without being bound by desire for results, and how to steady the mind through practice.",body:["The most quoted verse of the Gita (2.47) tells Arjuna that he has a right to action but not to its fruits, and warns him against both attachment to results and attachment to inaction. In Chapter 3 Arjuna asks why Krishna urges action if knowledge is higher. Krishna replies that no one can remain without action even for a moment, and that action offered as sacrifice does not bind. In Chapter 4 he introduces the idea of inaction within action, and states that he descends whenever dharma declines (4.7\u20138).","Chapter 5 asks whether renunciation of action or its disciplined practice is better, and answers that both lead to the same goal, though the discipline of action is easier. Chapter 6 teaches meditation: a steady seat, a mind trained by practice and detachment, and the vision of the yogi who sees the Self in all beings.","Many modern readers go straight to this section for its practical advice: act fully, but attend to the doing and the offering, not the result."],variants:["Shankara reads these chapters as preparing the mind for knowledge; Tilak, in the Gita Rahasya (1915), read them as a call for active engagement in the world; Gandhi named the central idea anasakti, non-attachment."],scholarship:"Scholars find in this section a blending of Vedic sacrifice (yajna), Upanishadic knowledge and the ascetic ideal of renunciation, reinterpreted as action performed without desire (Flood 1996).",characters:["arjuna","krishna"],alsoAppearing:["Sanjaya"],places:["kurukshetra"],motif:"flame",themes:["Action","Detachment","Meditation"]},{epic:"bhagavad-gita",slug:"knowledge-and-devotion",order:3,title:"Knowledge and Devotion",section:"Chapters 7\u201310 and 12",locator:"Bhagavad Gita 7\u201310, 12",summary:"Krishna describes his own nature, and says that those who offer him love in simple things are dear to him.",body:['In Chapters 7 and 8 Krishna describes his higher and lower natures: the elements and the living self, both his own, with all beings strung on him like pearls on a thread. Chapter 9, "the royal knowledge", says that he pervades the world but is not contained in it, and that whoever offers him a leaf, a flower, a fruit or water with love, he accepts (9.26).',"Chapter 10 lists his manifestations: among rivers he is the Ganga, among trees the ashvattha, among the senses the mind. Chapter 12 opens with a question: who is better, those devoted to a personal God or those who meditate on the imperishable and unmanifest? Krishna says both reach him, but the unmanifest path is harder for embodied beings, and describes the devotee dear to him: friendly, free from ego, even-minded in pleasure and pain."],variants:["Ramanuja treats this middle section as the heart of the Gita, teaching loving devotion to a personal God. Shankara reads it as supporting knowledge of the one Self. Gaudiya Vaishnavas emphasise the personal Krishna of Chapter 9."],scholarship:"This section is where the Gita is most clearly theistic. Scholars see in it one of the earliest textual expressions of bhakti as a path in its own right (Flood 1996).",characters:["arjuna","krishna"],alsoAppearing:[],places:["kurukshetra"],motif:"lotus",themes:["Devotion","Knowledge","Divine presence"]},{epic:"bhagavad-gita",slug:"the-cosmic-form",order:4,title:"The Cosmic Form",section:"Chapter 11",locator:"Bhagavad Gita 11",summary:"Arjuna asks to see Krishna's divine form and is overwhelmed by what he sees.",body:["Arjuna asks to see the form that Krishna has described. Krishna grants him divine sight, and Arjuna sees a vast shape with countless mouths and eyes, containing all gods, all beings and the whole universe within his body, radiant and unbounded.","Arjuna's awe turns to terror. He sees warriors f
