 has a fully developed mythology: his marriage to Parvati, the burning of Kama, the drinking of the poison that rose at the churning of the ocean, and his appearance as an endless column of light."],inTradition:["Shaiva traditions, among them Shaiva Siddhanta, Kashmir Shaivism and the Virashaiva (Lingayat) community, teach that Shiva performs five acts: creation, preservation, dissolution, concealment and grace. For many devotees the lingam, an aniconic pillar, is his primary form for worship.","The Tamil Nayanar saints (roughly sixth to ninth centuries CE) sang of Shiva in temples across the south, and twelve jyotirlinga shrines, among them Kedarnath, Somnath and Rameswaram, are pilgrimage goals across the subcontinent."],inScholarship:["Historians describe Shiva as emerging from several streams: Vedic Rudra, regional ascetic and ritual cults, and organised sectarian devotion such as the Pashupata movement of the early centuries CE.",'A seal from the Indus Valley showing a seated, horned figure is often called "proto-Shiva". Most specialists regard that identification as unproven, since the Indus script is undeciphered and no text explains the image (Possehl 2002).'],facts:[{label:"Abode",value:"Mount Kailash"},{label:"Mount",value:"Nandi, the bull"},{label:"Consort",value:"Parvati"},{label:"Children",value:"Ganesha and Kartikeya (Skanda, Murugan)"},{label:"Major festival",value:"Maha Shivaratri"},{label:"Sacred sites",value:"Varanasi, Kedarnath, Rameswaram, Somnath"}],symbols:[{name:"Trident (trishula)",meaning:"Traditional readings link its three points to the three gunas, to past, present and future, or to will, knowledge and action. Readings differ between lineages."},{name:"Damaru (hourglass drum)",meaning:"Held by Nataraja; its beat is read as the sound from which creation unfolds."},{name:"Crescent moon",meaning:"Worn in the matted hair; associated with the cycles of time and with Shiva's mastery of them."},{name:"Ganga in the hair",meaning:"Recalls the story in which Shiva receives the descending river so that the earth is not shattered by her fall."},{name:"Third eye",meaning:"The eye of insight; in myth it burns Kama, the god of desire."},{name:"Ash (vibhuti)",meaning:"Marks renunciation and the impermanence of the body."},{name:"Lingam",meaning:"An aniconic form worshipped in most Shaiva temples. Interpretations vary widely; see Kramrisch (1981) for a deep reading."}],iconography:["Shiva is shown as a meditating yogi on a tiger skin, as the four-armed dancer Nataraja inside a ring of flame, as Dakshinamurti the silent teacher facing south, and as Ardhanarishvara, half male and half female.","The Chola bronzes of South India, made from about the tenth century CE, fixed the classic Nataraja form: one foot raised, the other pressing down a small figure that traditional commentary calls forgetfulness or ignorance."],stories:[{title:"The poison and the churning",summary:"When the ocean is churned for the nectar of immortality, a deadly poison rises first. Shiva holds it in his throat, which turns blue.",chapter:{epic:"bhagavata-purana",chapter:"churning-of-the-ocean"}},{title:"The bow that Rama strings",summary:"In the first book of the Ramayana the bow of Shiva, kept by King Janaka, becomes the test for Sita's suitors.",chapter:{epic:"ramayana",chapter:"birth-and-bow"}},{title:"The descent of the Ganga",summary:"Told in the Ramayana's first book and retold in the Puranas: Shiva receives the river in his hair so that her fall does not break the earth."},{title:"The burning of Kama",summary:"Shiva's meditation is disturbed by Kama, whom his third eye burns. The story leads to Parvati's penance and their marriage; Kalidasa's poem Kumarasambhava tells it at length."}],relationships:[{slug:"parvati",name:"Parvati",relation:"Consort"},{slug:"ganesha",name:"Ganesha",relation:"Son"},{slug:"hanuman",name:"Hanuman",relation:"Regarded in some traditions as an aspect of Rudra-Shiva"},{slug:"vishnu",name:"Vishnu",relation:"Companion deity; joint Hari-Hara images"},{slug:"brahma",name:"Brahma",relation:"Fellow member of the triad (Trimurti) in Puranic thought"},{slug:"ravana",name:"Ravana",relation:"A devotee of Shiva in the epic and later tradition"}],references:[{source:"rigveda-jb",locator:"Rigveda 2.33",note:"A hymn to Rudra, the Vedic ancestor of Shiva."},{source:"upanishads-olivelle",note:"Shvetashvatara Upanishad: an early monotheistic address to Rudra / Shiva."},{source:"kramrisch-siva",note:"Extended interpretive study of Shiva in myth and image."},{source:"possehl-indus",note:'On the Indus "proto-Shiva" seal and why the identification is contested.'},{source:"dimmitt-vanbuitenen",note:"Puranic Shiva myths in translation."}],tags:["Shaiva","Trimurti","Himalaya","Asceticism","Dance"],related:["parvati","ganesha","hanuman","mount-kailash","varanasi","kedarnath","rameswaram"]},{slug:"vishnu",name:"Vishnu",native:"\u0935\u093F\u0937\u094D\u0923\u0941",iast:"Vi\u1E63\u1E47u",epithets:["Narayana","Hari","Padmanabha","Vasudeva"],tagline:"The preserver who enters the world to restore balance.",motif:"wheel",traditions:["Vaishnava","Smarta"],summary:"Vishnu is the supreme God for Vaishnavas and one of the principal deities for most other Hindus. Traditions describe him as pervading the universe, resting on the cosmic serpent, and descending as avatars, among them Rama and Krishna, when dharma is endangered.",inTexts:["In the Rigveda Vishnu is a relatively minor god celebrated for crossing the universe in three strides (Rigveda 1.154). He is a close companion of Indra. The Brahmanas identify him with the sacrifice itself, and the later story of the dwarf Vamana grows out of the three strides.","In the Mahabharata and the Bhagavad Gita, Vishnu is identified with Vasudeva-Krishna. The Gita (4.7\u20138) states the principle behind avatars: he takes birth when dharma declines. The Puranas list ten principal avatars: Matsya, Kurma, Varaha, Narasimha, Vamana, Parashurama, Rama, Krishna (or Balarama in some lists), the Buddha in some lists, and Kalki still to come. The thousand names of Vishnu form a celebrated hymn in the Mahabharata."],inTradition:["Vaishnava communities worship Vishnu or one of his avatars as supreme. Sri Vaishnavism, associated with Ramanuja, teaches that Vishnu is accessible through grace and devotion, and honours 108 divya desam temples sung by the Tamil Alvars. Gaudiya, Pushtimarg and other traditions centre on Krishna.","Vishnu rests on Shesha, the cosmic serpent, on the ocean of milk; from a lotus growing from his navel Brahma is born. Festivals include Vaikuntha Ekadashi, Rama Navami and Janmashtami, which celebrate his avatars."],inScholarship:["Scholars link Vishnu's rise from a modest Vedic deity to a supreme god with the merging of several streams in the centuries around the turn of the common era: Vasudeva-Krishna devotion, the theology of Narayana, and the avatar doctrine (Flood 1996).","Inscriptions and temples of the Gupta period, roughly the fourth to sixth centuries CE, show Vishnu as a favoured royal deity, with the earliest surviving temples devoted to him."],facts:[{label:"Abode",value:"Vaikuntha; the ocean of milk in Puranic cosmology"},{label:"Mount",value:"Garuda, the eagle-like king of birds"},{label:"Consort",value:"Lakshmi"},{label:"Principal avatars",value:"Matsya, Kurma, Varaha, Narasimha, Vamana, Parashurama, Rama, Krishna, Buddha (in some lists), Kalki"},{label:"Festivals",value:"Vaikuntha Ekadashi, Rama Navami, Janmashtami, Diwali"}],symbols:[{name:"Sudarshana chakra (discus)",meaning:"A weapon that returns to its master; read as the wheel of time and of cosmic order."},{name:"Panchajanya (conch)",meaning:"Its call is read as the primal sound, Om."},{name:"Kaumodaki (mace)",meaning:"Power and the authority of knowledge."},{name:"Lotus (padma)",meaning:"Purity and the emergence of the universe, as in the lotus from which Brahma is born."},{name:"Garuda",meaning:"The mount and banner of Vishnu; a figure of speed, vigilance and devotion."},{name:"Shesha (Ananta)",meaning:`The serpent who forms Vishnu's couch; "endless" is the meaning of one of his names.`}],iconography:["Vishnu is shown standing, four-armed, with dark blue skin like a rain cloud and a yellow garment, carrying the discus, conch, mace and lotus. In another type he reclines on Shesha while Lakshmi attends him.","Gupta-period temples such as the one at Deogarh in central India carry carved panels of the reclining Vishnu and avatar scenes that set the pattern for later sculpture."],stories:[{title:"The churning of the ocean",summary:"Vishnu supports the churning as a tortoise (Kurma) and later takes the form of Mohini to distribute the nectar.",chapter:{epic:"bhagavata-purana",chapter:"churning-of-the-ocean"}},{title:"Gajendra, king of elephants",summary:"Seized by a crocodile, an elephant calls out to the one refuge of all beings; Vishnu arrives on Garuda.",chapter:{epic:"bhagavata-purana",chapter:"gajendra"}},{title:"Prahlada and Narasimha",summary:"Vishnu appears as the man-lion to protect a devoted child from his tyrannical father.",chapter:{epic:"bhagavata-purana",chapter:"prahlada"}},{title:"The three strides of Vamana",summary:"A dwarf asks King Bali for as much land as he can cover in three steps, then grows to span the worlds."}],relationships:[{slug:"lakshmi",name:"Lakshmi",relation:"Consort"},{slug:"krishna",name:"Krishna",relation:"Avatar (or, in some traditions, the source of Vishnu)"},{slug:"rama",name:"Rama",relation:"Avatar"},{slug:"brahma",name:"Brahma",relation:"Born from the lotus of Vishnu's navel in Vaishnava tradition"},{slug:"shiva",name:"Shiva",relation:"Counterpart in Hari-Hara images"}],references:[{source:"rigveda-jb",locator:"Rigveda 1.154",note:"The hymn of the three strides."},{source:"gita-miller",locator:"Bhagavad Gita 4.7\u20138",note:"The statement of the avatar principle."},{source:"flood-intro",note:"On the historical development of Vaishnavism."},{source:"rocher-puranas",note:"Survey of the Puranas that tell Vishnu's myths."},{source:"dimmitt-vanbuitenen",note:"Vishnu myths in translation."}],tags:["Vaishnava","Trimurti","Avatar","Preservation"],related:["lakshmi","krishna","rama","avatara","badrinath","puri"]},{slug:"brahma",name:"Brahma",native:"\u092C\u094D\u0930\u0939\u094D\u092E\u093E",iast:"Brahm\u0101",epithets:["Prajapati","Svayambhu","Pitamaha","Hiranyagarbha"],tagline:"The four-faced creator, who sets worlds in motion.",motif:"lotus",traditions:["Puranic","Smarta"],summary:"Brahma is the creator god of the Puranic triad, ranked with Vishnu and Shiva. He is not to be confused with Brahman, the ultimate reality of the Upanishads. Though honoured in myth and ritual, he has very few temples of his own.",inTexts:['The Vedic background is Prajapati, "lord of creatures", and the Hiranyagarbha ("golden womb") hymn (Rigveda 10.121), which asks to which god we should offer. In the Manusmriti the creator is born from a golden egg. The masculine Brahma of the epics and Puranas develops from these figures, distinct from the neuter principle Brahman.',"In Puranic cosmology a day of Brahma, a kalpa, equals a thousand cycles of four ages, and his life spans a hundred such years. Narratives show him granting boons to ascetics, including the king of Lanka in the Ramayana, creating the problems that Vishnu or Shiva then resolve."],inTradition:["Brahma is invoked in rituals and honoured in the Puranas, but dedicated worship is rare. The temple at Pushkar in Rajasthan is the best-known exception and a fair is held there each year at Kartik Purnima.","Different Puranic stories explain the scarcity of temples, for example a curse after the myth of Shiva's pillar of light. None is accepted by all traditions as the explanation."],inScholarship:["Historians treat Brahma as a Brahmanical creation-figure whose cult never grew to the size of the Shaiva or Vaishnava cults. His iconography is consistent from the Gupta period onward: four faces, four arms and a beard."],facts:[{label:"Mount",value:"Hamsa (swan)"},{label:"Consort",value:"Saraswati (in Puranic tradition)"},{label:"Abode",value:"Brahmaloka (Satyaloka)"},{label:"Best-known temple",value:"Pushkar, Rajasthan"},{label:"Related festival",value:"Kartik Purnima at Pushkar"}],symbols:[{name:"Four faces",meaning:"Traditionally linked to the four Vedas and the four directions."},{name:"Kamandalu (water pot)",meaning:"Ascetic purity and the primeval waters from which creation arises."},{name:"Rosary (akshamala)",meaning:"The counting of time and of cycles of creation."},{name:"Book or Vedas",meaning:"The knowledge that accompanies creation."},{name:"Lotus seat",meaning:"The place of birth from Vishnu's navel in Vaishnava tradition."},{name:"Hamsa (swan)",meaning:"Discernment, with the traditional trope of separating milk from water."}],iconography:["Brahma is shown seated on a lotus, with four faces of which three are visible, four arms, and a beard, which sets him apart from other principal deities."],stories:[{title:"Born from the lotus",summary:"In Vaishnava telling, Brahma appears on a lotus growing from Vishnu's navel and, uncertain of his origin, goes in search of the stem."},{title:"Rousing Vishnu",summary:"In the Devi Mahatmya, Brahma praises Yoga Nidra to release Vishnu from sleep so that he can fight the demons Madhu and Kaitabha.",chapter:{epic:"devi-mahatmya",chapter:"madhu-and-kaitabha"}},{title:"Boons to the powerful",summary:"Brahma's boon to Ravana, which protects him from gods and demons but not from humans, shapes the plot of the Ramayana.",chapter:{epic:"ramayana",chapter:"the-war-for-lanka"}}],relationships:[{slug:"saraswati",name:"Saraswati",relation:"Consort in Puranic tradition (some texts call her his daughter)"},{slug:"vishnu",name:"Vishnu",relation:"Source in Vaishnava accounts of Brahma's birth"},{slug:"shiva",name:"Shiva",relation:"Fellow member of the Trimurti"},{slug:"narada",name:"Narada",relation:"Mind-born son in Puranic tradition"}],references:[{source:"rigveda-jb",locator:"Rigveda 10.121",note:"The Hiranyagarbha hymn; background to the creator-figure."},{source:"dimmitt-vanbuitenen",note:"Creation myths from the Puranas in translation."},{source:"michaels-hinduism",note:"On the relative place of the three principal gods in Hindu practice."},{source:"rocher-puranas",note:"On the Puranic figure of Brahma."}],tags:["Creation","Trimurti","Puranic","Cosmology"],related:["saraswati","vishnu","shiva","brahman","yuga"]},{slug:"lakshmi",name:"Lakshmi",native:"\u0932\u0915\u094D\u0937\u094D\u092E\u0940",iast:"Lak\u1E63m\u012B",epithets:["Shri","Padma","Kamala","Mahalakshmi","Vishnupriya"],tagline:"Grace, fortune and prosperity: Shri, who settles where she is honoured.",motif:"lotus",traditions:["Vaishnava","Shakta","Smarta"],summary:"Lakshmi, also called Shri, is the goddess of fortune, prosperity and auspiciousness, and the consort of Vishnu. She is widely worshipped in homes and businesses, most visibly at Diwali.",inTexts:["Shri appears in the Shri Sukta, a supplementary hymn (khila) attached to the Rigveda tradition, which invokes her as radiant, golden and lotus-bearing. Shri and Lakshmi were at first separate ideas of prosperity and auspiciousness that later merged. The Mahabharata contains passages in which Shri explains where she consents to dwell, and with whom.","In the Puranas (Vishnu Purana 1.9, Bhagavata Purana 8.8) Lakshmi emerges from the churning of the ocean and chooses Vishnu as her husband. The Vishnu Purana adds that she accompanies him in every avatar, as Padma with Vamana, Dharani with Parashurama, Sita with Rama and Rukmini with Krishna."],inTradition:["At Diwali many households light lamps and open their doors for Lakshmi Puja. In South India Varalakshmi Vratam and the worship of Ashta Lakshmi, the eight forms of the goddess, are widely observed.","Sri Vaishnava theology gives Shri a mediating role: devotees approach Vishnu through her compassion."],inScholarship:["Images of Shri-Lakshmi, often flanked by elephants pouring water over her (Gaja-Lakshmi), appear in Buddhist and Jain as well as Hindu contexts from the centuries around the turn of the era. Kinsley (1986) connects her with royal sovereignty and the idea that a king's fortune is a goddess who can depart."],facts:[{label:"Consort",value:"Vishnu"},{label:"Abode",value:"Vaikuntha; the lotus"},{label:"Mount",value:"Owl, in popular imagery (not in every tradition)"},{label:"Festivals",value:"Diwali, Varalakshmi Vratam, Sharad Purnima (Kojagari)"},{label:"Forms",value:"Ashta Lakshmi: eight aspects of prosperity"}],symbols:[{name:"Lotus",meaning:'Purity and unfolding; she is called Padma and Kamala, both "lotus" names.'},{name:"Gold coins",meaning:"Material prosperity falling from her open hand."},{name:"Two elephants",meaning:"Royal power and abundance; the Gaja-Lakshmi image."},{name:"Kalasha (full vessel)",meaning:"Fullness and auspiciousness."},{name:"Owl",meaning:"A popular vehicle in many regions; interpretations vary."}],iconography:["Lakshmi is shown seated or standing on a lotus, with two or four arms, one hand pouring coins and another in a gesture of blessing, often attended by two elephants. Beside Vishnu she appears at his feet or on his chest."],stories:[{title:"Rising from the ocean",summary:"Among the treasures that emerge from the churning, Lakshmi appears and, in the Vishnu Purana, garlands Vishnu.",chapter:{epic:"bhagavata-purana",chapter:"churning-of-the-ocean"}},{title:"Lakshmi in the avatars",summary:"In Puranic tradition she accompanies Vishnu in each avatar; Sita is regarded as her incarnation by many later traditions, though not described that way in the core Ramayana.",chapter:{epic:"ramayana",chapter:"birth-and-bow"}}],relationships:[{slug:"vishnu",name:"Vishnu",relation:"Consort"},{slug:"sita",name:"Sita",relation:"Regarded in later tradition as her avatar"},{slug:"saraswati",name:"Saraswati",relation:"Fellow goddess in the Tridevi"},{slug:"parvati",name:"Parvati",relation:"Fellow goddess in the Tridevi"}],references:[{source:"kinsley-goddesses",note:"Chapter on Shri-Lakshmi: texts, icons and ideas of fortune."},{source:"rigveda-jb",note:"The Shri Sukta is a khila (supplementary hymn), so it is not part of the main Rigveda collection translated here."},{source:"hawley-wulff",note:"Regional goddess traditions in context."},{source:"dimmitt-vanbuitenen",note:"The churning myth in Puranic translation."}],tags:["Shakta","Vaishnava","Prosperity","Diwali"],related:["vishnu","sita","saraswati","parvati"]},{slug:"saraswati",name:"Saraswati",native:"\u0938\u0930\u0938\u094D\u0935\u0924\u0940",iast:"Sarasvat\u012B",epithets:["Vagdevi","Bharati","Sharada","Vani"],tagline:"River, speech and wisdom, the goddess of learning and the arts.",motif:"veena",traditions:["Shakta","Smarta","Vaishnava"],summary:"Saraswati is the goddess of knowledge, speech, music and the arts. She began in the Rigveda as both a great river and a deity, and became the patron of scholars, musicians and students, also honoured by Jains.",inTexts:["The Rigveda praises Sarasvati as a mighty river (hymns 6.61 and 7.95\u201396) and lists her among rivers in the Nadistuti (10.75). In the Brahmanas she is identified with Vac, the goddess of Speech, to whom Rigveda 10.125 gives a voice as the power behind the gods.","The Puranas make her the consort of Brahma, though some texts describe her as his daughter. In the Devi Mahatmya, Mahasaraswati is the form of the Goddess that defeats Shumbha and Nishumbha. In the Mahabharata, Balarama travels along the Sarasvati, and the text mentions a place where she disappears into the sand."],inTradition:["Vasant Panchami in late winter is her main festival; many families begin a child's first writing (vidyarambham) then. On the ninth day of Navaratri books, tools and instruments are placed before her.","At the confluence at Prayagraj tradition holds that a hidden Sarasvati flows invisibly beside the Ganga and Yamuna, forming the Triveni Sangam."],inScholarship:["Which river the Vedic Sarasvati corresponds to is debated. Many scholars favour the Ghaggar\u2013Hakra system in northwest India; others point to the Haraxvaiti (Helmand) of Afghanistan. The discussion is partly a question of how far Vedic geography can be mapped on to the modern landscape."],facts:[{label:"Mount",value:"Hamsa (swan) or peacock"},{label:"Consort",value:"Brahma, in Puranic tradition"},{label:"Realm",value:"Knowledge, speech, music, the arts"},{label:"Festival",value:"Vasant Panchami; ninth day of Navaratri"},{label:"Also honoured by",value:"Jains (Shrutadevi) and some Buddhist traditions"}],symbols:[{name:"Veena",meaning:"A stringed instrument; harmony, the arts and the resonance of knowledge."},{name:"Book (pustaka)",meaning:"The Vedas and learning in general."},{name:"Rosary (mala)",meaning:"Meditation and disciplined repetition."},{name:"Hamsa (swan)",meaning:"Discernment between the real and the unreal."},{name:"White garment",meaning:"Purity of knowledge."}],iconography:["Saraswati is shown seated on a white lotus or standing beside a swan, with four arms holding a veena, a book, a rosary and a water pot, clothed in white. In some regions the veena is replaced by hands in a teaching gesture."],stories:[{title:"The third form of the Goddess",summary:"In the Devi Mahatmya the Goddess appears as Mahasaraswati to defeat Shumbha and Nishumbha.",chapter:{epic:"devi-mahatmya",chapter:"shumbha-and-nishumbha"}},{title:"The river that disappears",summary:"Epic and later tradition speak of a Sarasvati that vanishes into the desert and is hidden at Prayagraj."}],relationships:[{slug:"brahma",name:"Brahma",relation:"Consort in Puranic tradition (also described as his daughter)"},{slug:"lakshmi",name:"Lakshmi",relation:"Fellow goddess in the Tridevi"},{slug:"parvati",name:"Parvati",relation:"Fellow goddess in the Tridevi"}],references:[{source:"rigveda-jb",locator:"Rigveda 6.61, 7.95, 10.75, 10.125",note:"Hymns to the river, the rivers collectively, and Vac."},{source:"kinsley-goddesses",note:"On Sarasvati as river, Vac and goddess of learning."},{source:"eck-sacred-geography",note:"On the Sarasvati at Prayagraj and in sacred geography."},{source:"coburn-encountering",note:"Translation of the Devi Mahatmya, including the Mahasaraswati episode."}],tags:["Shakta","Knowledge","Music","River"],related:["brahma","lakshmi","parvati","prayagraj"]},{slug:"parvati",name:"Parvati",native:"\u092A\u093E\u0930\u094D\u0935\u0924\u0940",iast:"P\u0101rvat\u012B",epithets:["Uma","Gauri","Haimavati","Ambika"],tagline:"Daughter of the mountain, wife of Shiva, and a form of the Great Goddess.",motif:"mountain",traditions:["Shakta","Shaiva","Smarta"],summary:'Parvati, "she of the mountain", is the daughter of the Himalaya and consort of Shiva. She is a figure of devotion and determination in Shaiva myth and one of the best-loved faces of the Goddess, the power (shakti) behind the universe, for Shaktas.',inTexts:[`The Kena Upanishad mentions Uma Haimavati, a woman who reveals the nature of Brahman to the gods. The Ramayana's first book names Ganga and Uma as daughters of the mountain king Himavat. Kalidasa's Sanskrit poem Kumarasambhava ("The Birth of Kumara") tells of her penance to win Shiva and their marriage.`,"In the Puranas, Parvati is also the rebirth of Sati, Daksha's daughter, who gave up her body after her father insulted Shiva. In the Devi Mahatmya, the goddess Kaushiki emerges from Parvati's body to confront the demons Shumbha and Nishumbha."],inTradition:['Shaktas hold that Parvati is one form of the single supreme Goddess, who is also Durga and Kali. On the first night of Navaratri, devotees honour her as Shailaputri, "daughter of the mountain".',"Women in many regions keep Gauri and Teej festivals for Parvati's blessing on marriage and family, and the union of Shiva and Parvati is a popular image of balance, expressed in the Ardhanarishvara form."],inScholarship:['Scholars distinguish the Vedic Uma and Ambika, the epic "daughter of the Himalaya", and the Puranic Parvati, and have argued that her figure absorbed several regional goddesses as Shaiva devotion spread (Kinsley 1986).'],facts:[{label:"Consort",value:"Shiva"},{label:"Children",value:"Ganesha and Kartikeya"},{label:"Abode",value:"Mount Kailash"},{label:"Mount",value:"Lion or tiger (in warrior forms); Nandi (with Shiva)"},{label:"Festivals",value:"Navaratri, Gauri and Teej festivals, Maha Shivaratri"}],symbols:[{name:"Lotus",meaning:"Grace and the unfolding of the self."},{name:"Lion or tiger",meaning:"Power; the vehicle of the warrior Goddess."},{name:"Mountain",meaning:"Her origin and steadfastness."},{name:"Ardhanarishvara",meaning:"The joint form with Shiva: masculine and feminine principles as one."}],iconography:["Parvati is shown seated beside Shiva on Kailash, often with the child Ganesha on her lap, or standing beside him as Uma-Maheshvara. Elsewhere she is depicted in a wedding scene or as a penitent in the forest."],stories:[{title:"The penance of Parvati",summary:"Parvati practises severe austerities to win Shiva, who has withdrawn into meditation. Kalidasa's Kumarasambhava is the classical telling."},{title:"Kaushiki",summary:"In the Devi Mahatmya the goddess Kaushiki emerges from Parvati's body when she goes to bathe and confronts the asuras.",chapter:{epic:"devi-mahatmya",chapter:"shumbha-and-nishumbha"}},{title:"Sati and the Shakti Pithas",summary:"After Sati's death, her body is carried across the land by Shiva; the places where parts fall are honoured as Shakti Pithas, including Kamakhya."}],relationships:[{slug:"shiva",name:"Shiva",relation:"Consort"},{slug:"ganesha",name:"Ganesha",relation:"Son"},{slug:"lakshmi",name:"Lakshmi",relation:"Fellow goddess in the Tridevi"},{slug:"saraswati",name:"Saraswati",relation:"Fellow goddess in the Tridevi"}],references:[{source:"kinsley-goddesses",note:"On Parvati, Uma and Durga and how their figures relate."},{source:"coburn-encountering",note:"Translation of the Devi Mahatmya."},{source:"sircar-sakta",note:"On the Shakti Pithas and the Sati legend."},{source:"hawley-wulff",note:"Essays on goddesses of India."}],tags:["Shakta","Shaiva","Himalaya","Navaratri"],related:["shiva","ganesha","kamakhya","devi-mahatmya"]},{slug:"ganesha",name:"Ganesha",native:"\u0917\u0923\u0947\u0936",iast:"Ga\u1E47e\u015Ba",epithets:["Ganapati","Vinayaka","Vighneshvara","Ekadanta","Lambodara"],tagline:"Lord of beginnings and remover of obstacles.",motif:"om",traditions:["Ganapatya","Smarta","Shaiva"],summary:"Ganesha, the elephant-headed son of Shiva and Parvati, is invoked at the start of rituals, journeys, writing and new ventures. He is among the most widely worshipped Hindu deities, across sects and regions.",inTexts:["The name Ganapati occurs in the Rigveda (2.23.1) as an epithet of another deity, Brahmanaspati, so it is not evidence of an elephant-headed god. The figure we know appears in the epics and Puranas. The story that Ganesha wrote the Mahabharata at Vyasa's dictation is found in some manuscript traditions but not in the critical edition.","The Puranas give different accounts of his origin. In one, Parvati makes him from her own body and Shiva, not knowing him, severs his head and replaces it with an elephant's. In another, Shiva himself creates him. The Ganesha Purana and Mudgala Purana, later in date, are devoted to him."],inTradition:["Worship usually begins with Ganesha, whatever the main deity. The festival of Ganesh Chaturthi, in August or September, is celebrated at home and in public pavilions, and was given a strong public form in Maharashtra in the 1890s, notably by B. G. Tilak.","The eight Ashtavinayaka shrines in Maharashtra form a pilgrimage circuit. In some traditions Ganesha is married to Riddhi and Siddhi, in others he remains celibate."],inScholarship:["Images of Ganesha appear from around the fourth or fifth century CE and become common within two centuries, which makes him a latecomer to the textual canon and a very fast riser (Courtright 1985)."],facts:[{label:"Parents",value:"Shiva and Parvati"},{label:"Sibling",value:"Kartikeya (Skanda, Murugan)"},{label:"Mount",value:"Mushika, the mouse"},{label:"Favoured offering",value:"Modak (sweet dumpling)"},{label:"Festival",value:"Ganesh Chaturthi"}],symbols:[{name:"Elephant head",meaning:"Traditionally read as wisdom, memory and strength."},{name:"Single tusk",meaning:'Ekadanta, "one-tusked"; stories of how the other tusk was lost vary.'},{name:"Large belly",meaning:"Lambodara; capacity to accept the world's experiences and contain the universe."},{name:"Mouse",meaning:"A small, restless creature mastered by the god; read as control over desire."},{name:"Axe and noose",meaning:"Cutting through attachments and drawing devotees toward truth."},{name:"Modak",meaning:"The sweet reward of spiritual effort."}],iconography:["Ganesha is shown seated or dancing, with an elephant's head, a human body, four arms and a large belly, often accompanied by a mouse. Regional variants include standing, dancing and many-headed forms."],stories:[{title:"How Ganesha got his head",summary:"Different Puranas tell the beheading and restoration differently; all agree he is Shiva's son and receives pre-eminence at the start of worship."},{title:"The scribe of the Mahabharata",summary:"In some manuscripts Ganesha writes the epic as Vyasa dictates, on condition that Vyasa never pause.",chapter:{epic:"mahabharata",chapter:"the-kuru-house"}},{title:"The race around the world",summary:"Ganesha and his brother race around the world; Ganesha circles his parents, saying they are his world."}],relationships:[{slug:"shiva",name:"Shiva",relation:"Father"},{slug:"parvati",name:"Parvati",relation:"Mother"},{slug:"vyasa",name:"Vyasa",relation:"Dictates the Mahabharata to Ganesha in some manuscript traditions"}],references:[{source:"courtright-ganesa",note:"The principal study of Ganesha's history and meaning."},{source:"rigveda-jb",locator:"Rigveda 2.23.1",note:"The Ganapati verse, addressed to Brahmanaspati."},{source:"mbh-critical",note:"The critical edition, for the absence of the scribe story in the main text."},{source:"dimmitt-vanbuitenen",note:"Ganesha myths in translation."}],tags:["Beginnings","Smarta","Festival","Maharashtra"],related:["shiva","parvati","vyasa"]},{slug:"hanuman",name:"Hanuman",native:"\u0939\u0928\u0941\u092E\u093E\u0928\u094D",iast:"Hanum\u0101n",epithets:["Maruti","Anjaneya","Pavanaputra","Mahavira"],tagline:"Strength and devotion: the monkey hero of the Ramayana.",motif:"mace",traditions:["Vaishnava","Ramanandi","Shaiva"],summary:"Hanuman, the vanara (monkey) hero of the Ramayana, is celebrated for strength, intelligence and utter devotion to Rama. He is a god in his own right across northern and western India, honoured in wrestlers' gymnasiums and in temples on street corners.",inTexts:["In the Valmiki Ramayana, Hanuman is the son of Vayu, the wind, and Anjana. He first meets Rama in the Kishkindha Kanda, where Rama admires his speech. The Sundara Kanda is built around him: he leaps across the ocean, finds Sita in Lanka, and sets the city on fire. In the Yuddha Kanda he carries the mountain of healing herbs.","In the Mahabharata, Hanuman meets his half-brother Bhima in the forest during the Pandavas' exile and later appears on the banner of Arjuna's chariot."],inTradition:["Tulsidas's Ramcharitmanas (1574 onward) gives Hanuman a large devotional role, and the Hanuman Chalisa is traditionally attributed to him. The Ramanandi order celebrates him as the ideal servant of Rama.","Some Shaiva texts, such as the Shiva Purana, count him as an incarnation of Rudra. Tuesdays and Saturdays are days of worship in many areas, and wrestlers (pehlwans) honour him as their patron."],inScholarship:["Lutgendorf (2007) shows that the Hanuman of the Valmiki Ramayana is a brilliant envoy and warrior but not yet a central object of worship. His growth into a god in his own right is traced across the medieval centuries and accelerates with the rise of Ramanandi devotion and the popularity of Tulsidas."],facts:[{label:"Parentage",value:"Vayu (wind) and Anjana, in the Ramayana"},{label:"Weapon",value:"Gada (mace)"},{label:"Traditional homeland",value:"Kishkindha region, near Hampi"},{label:"Festival",value:"Hanuman Jayanti (date varies by region)"},{label:"Patron of",value:"Wrestlers, travellers, and those seeking courage"}],symbols:[{name:"Gada (mace)",meaning:"Strength placed in the service of dharma."},{name:"Mountain in hand",meaning:"The Sanjivani herb mountain carried to heal Lakshmana."},{name:"Opened chest",meaning:"A popular image showing Rama and Sita in his heart, a sign of total devotion."},{name:"Vermilion",meaning:"A folk story tells that he smeared himself with sindoor after seeing Sita wear it for Rama."}],iconography:["Hanuman is shown as a muscular monkey-faced figure with a mace; standing, flying, carrying the mountain, or kneeling before Rama and Sita with his chest open. In many temples his image is coated in vermilion and oil."],stories:[{title:"The leap across the ocean",summary:"Hanuman grows to great size, overcomes the obstacles of the sea, and enters Lanka to find Sita.",chapter:{epic:"ramayana",chapter:"leap-across-the-ocean"}},{title:"Meeting Rama in Kishkindha",summary:"Disguised as a wandering mendicant (a Brahmin, in some later retellings), Hanuman approaches Rama and Lakshmana, and then brings them to Sugriva.",chapter:{epic:"ramayana",chapter:"friends-in-kishkindha"}},{title:"Hanuman and Bhima",summary:"In the Mahabharata, Bhima meets an old monkey blocking his path who is revealed to be his half-brother.",chapter:{epic:"mahabharata",chapter:"years-in-the-forest"}}],relationships:[{slug:"rama",name:"Rama",relation:"Lord and object of devotion"},{slug:"sita",name:"Sita",relation:"Finds her in Lanka"},{slug:"shiva",name:"Shiva",relation:"Regarded as an aspect of Rudra in some traditions"},{slug:"bhima",name:"Bhima",relation:"Half-brother (both sons of Vayu) in the Mahabharata"},{slug:"arjuna",name:"Arjuna",relation:"Appears on Arjuna's chariot banner"}],references:[{source:"lutgendorf-hanuman",note:"The main study of Hanuman across texts and centuries."},{source:"goldman-ramayana",note:"Annotated translation of the Kishkindha and Sundara books."},{source:"lutgendorf-life",note:"On Tulsidas's Hanuman and the Manas tradition."},{source:"hill-manas",note:"Early translation of the Ramcharitmanas."}],tags:["Ramayana","Devotion","Vaishnava","Strength"],related:["rama","sita","hampi","shiva"]},{slug:"krishna",name:"Krishna",native:"\u0915\u0943\u0937\u094D\u0923",iast:"K\u1E5B\u1E63\u1E47a",epithets:["Govinda","Gopala","Keshava","Madhava","Vasudeva"],tagline:"Cowherd, statesman and teacher: many faces of one god.",motif:"flute",traditions:["Vaishnava","Gaudiya","Pushtimarg","Varkari"],summary:"Krishna is one of the most beloved Hindu deities: the mischievous child of Vrindavan, the flute-playing youth, the statesman of the Mahabharata, and the teacher of the Bhagavad Gita. Most Vaishnavas regard him as an avatar of Vishnu; some traditions regard him as the supreme God himself.",inTexts:["In the Mahabharata, Krishna is the counsellor and charioteer of Arjuna and a prince of the Yadava clan who works for peace before the war. The Bhagavad Gita, spoken between two armies, is his teaching. The Harivamsa, an appendix to the Mahabharata, and the Vishnu Purana tell of his childhood and youth.","Book 10 of the Bhagavata Purana (probably composed in South India in the ninth or tenth century CE) gives the fullest narrative: his birth in prison at Mathura, his childhood among the cowherds, the lifting of Govardhana, and his later life at Dwarka. Chandogya Upanishad 3.17.6 mentions a Krishna, son of Devaki, as a pupil of a sage; whether this is the same figure is debated."],inTradition:["Janmashtami celebrates his birth at midnight. Devotional poets such as Surdas, Mirabai, Narsinh Mehta and the Bengali saint Chaitanya (sixteenth century) made Krishna the centre of an extensive bhakti literature, and the Warkari tradition worships him as Vithoba of Pandharpur.","Radha, Krishna's beloved in later devotional poetry, is not named in the Bhagavata Purana but appears prominently in Jayadeva's Gita Govinda (twelfth century) and in Gaudiya theology. At Puri, Jagannath is regarded by many devotees as a form of Krishna."],inScholarship:["Scholars see Krishna as a composite figure: a chieftain of the Vrishni-Yadava clan, a pastoral god of the cowherds, and a deity merged with Vishnu through the avatar doctrine. An inscription at Besnagar, dated to roughly the second or first century BCE, records a Greek envoy, Heliodorus, erecting a pillar for Vasudeva, which shows that devotion to Vasudeva-Krishna was already established by then (Thapar 2002; Flood 1996)."],facts:[{label:"Parents",value:"Devaki and Vasudeva; raised by Yashoda and Nanda"},{label:"Siblings",value:"Balarama (elder brother), Subhadra (sister)"},{label:"Principal queens",value:"Rukmini and Satyabhama"},{label:"Places",value:"Mathura, Vrindavan, Dwarka, Kurukshetra"},{label:"Festival",value:"Janmashtami"}],symbols:[{name:"Flute (venu)",meaning:"Its music is read as the divine call that draws the devotee."},{name:"Peacock feather",meaning:"Worn in his crown; beauty and the colours of the monsoon."},{name:"Butter",meaning:"The mischievous child of Vrindavan; the sweetness of divine play (lila)."},{name:"Cow and calf",meaning:"His pastoral life as Gopala, protector of cows."},{name:"Dark skin and yellow garment",meaning:"The colour of rain clouds; he shares this with Vishnu."}],iconography:["Krishna is shown as a crawling butter-stealing baby (Bal Gopal), a flute-playing youth in a triple-bend pose with Radha at his side, a lifter of Govardhana mountain, and a charioteer instructing Arjuna. At Puri the distinctive wooden form of Jagannath is a separate iconographic tradition."],stories:[{title:"Birth at midnight",summary:"Krishna is born to Devaki and Vasudeva in the prison of King Kamsa and carried across the Yamuna to Gokula.",chapter:{epic:"bhagavata-purana",chapter:"krishna-is-born"}},{title:"Lifting Govardhana",summary:"Krishna holds up a hill to shelter the cowherds from Indra's storm.",chapter:{epic:"bhagavata-purana",chapter:"govardhana"}},{title:"Sudama",summary:"Krishna welcomes his poor childhood friend and answers his unspoken need.",chapter:{epic:"bhagavata-purana",chapter:"sudama"}},{title:"The Gita",summary:"On the field of Kurukshetra Krishna teaches Arjuna about duty, action and devotion.",chapter:{epic:"bhagavad-gita",chapter:"arjuna-despairs"}}],relationships:[{slug:"vishnu",name:"Vishnu",relation:"Avatar of Vishnu (or his source, in some traditions)"},{slug:"arjuna",name:"Arjuna",relation:"Friend, cousin and student"},{slug:"draupadi",name:"Draupadi",relation:"Friend and protector"},{slug:"kunti",name:"Kunti",relation:"Aunt: sister of his father Vasudeva"},{slug:"yudhishthira",name:"Yudhishthira",relation:"Cousin and counsellor"}],references:[{source:"gita-miller",locator:"Bhagavad Gita 4.7\u20138",note:"The avatar principle spoken by Krishna."},{source:"bryant-krishna",note:"Translation of Book 10 of the Bhagavata Purana and introduction on its date."},{source:"hawley-butter-thief",note:"The child Krishna in devotional poetry."},{source:"kinsley-divine-player",note:"On lila, the idea of divine play."},{source:"thapar-early-india",note:"The historical context of Vasudeva-Krishna devotion."}],tags:["Vaishnava","Mahabharata","Bhakti","Gita"],related:["vishnu","arjuna","draupadi","mathura-vrindavan","dwarka","kurukshetra","bhagavad-gita"]}]});var Oe,rr=Ga(()=>{Oe=[{slug:"ramayana",name:"Ramayana",native:"\u0930\u093E\u092E\u093E\u092F\u0923",iast:"R\u0101m\u0101ya\u1E47a",roman:"I",kind:"Itihasa \xB7 Sanskrit epic",tagline:"The journey of Rama: exile, loss, and the cost of ideal kingship.",motif:"bow",summary:"The story of Prince Rama of Ayodhya, who is exiled for fourteen years, loses his wife Sita to the king of Lanka, and wins her back with the help of an army of vanaras led by Hanuman. Told in Sanskrit by Valmiki and retold in dozens of languages.",about:["The Ramayana follows Rama from his birth as the eldest son of King Dasharatha through exile in the forest, the abduction of Sita by Ravana, the war in Lanka, and his return to rule Ayodhya. It is also a long reflection on duty: a son's to his father, a king's to his subjects, a husband's to his wife, a brother's to his brothers.","The Sanskrit text attributed to Valmiki is in seven books (kandas). It is a kavya, a poem, as well as a story, and the opening of the text describes the first verse as arising spontaneously from the poet's grief at the death of a bird. For many Hindus Rama is an avatar of Vishnu; the text itself treats his divinity with varying emphasis from one book to another."],inTradition:["Tradition names Valmiki as the Adi Kavi, the first poet, and places Rama's life in the Treta Yuga. Retellings in the vernaculars, such as Kamban's Tamil Iramavataram and Tulsidas's Awadhi Ramcharitmanas, are loved as scripture in their own right, and are recited and performed in the annual Ramlila."],inScholarship:["Scholars generally regard Books 2 to 6 as the older core of the Valmiki text, with Books 1 and 7 added later, so that the epic reached close to its present form by around the third century CE. The dating of the core is uncertain and estimates begin around the fifth century BCE (Brockington 1998; Goldman 1984).","Many scholars note the Uttara Kanda's less settled textual history and its treatment of Sita as a place where tellings diverge sharply. Ramanujan (1991) argued that the question is not which Ramayana is the original but how each telling answers the others."],facts:[{label:"Language of the core text",value:"Sanskrit"},{label:"Structure",value:"Seven books (kandas), traditionally about 24,000 verses"},{label:"Traditional author",value:"Valmiki"},{label:"Traditional setting",value:"Treta Yuga"},{label:"Scholarly dating of the core",value:"Roughly fifth century BCE onward; layered"},{label:"Critical edition",value:"Oriental Institute, Baroda, 1960\u20131975"}],structureTitle:"The seven kandas",structure:[{name:"Bala Kanda",note:"Boyhood: Rama's birth, the guarding of the sacrifice, the bow of Shiva and Sita's marriage."},{name:"Ayodhya Kanda",note:"Ayodhya: the planned coronation, Kaikeyi's two boons, exile and the death of Dasharatha."},{name:"Aranya Kanda",note:"The forest: Shurpanakha, the golden deer and the abduction of Sita."},{name:"Kishkindha Kanda",note:"The vanara kingdom: Hanuman, Sugriva, Vali, and the search for Sita."},{name:"Sundara Kanda",note:"The beautiful book: Hanuman's journey to Lanka."},{name:"Yuddha Kanda",note:"The war with Ravana, and the return to Ayodhya."},{name:"Uttara Kanda",note:"The later book: Rama's reign, the exile of Sita and Rama's departure."}],versions:[{name:"Kamban's Iramavataram (Tamil)",note:"Usually dated to the twelfth century CE; gives Ravana and Sita memorable emotional depth."},{name:"Tulsidas's Ramcharitmanas (Awadhi)",note:"Begun, by the author's account, in 1574; the basis of the Ramlila tradition in northern India."},{name:"Krittivasa's Ramayana (Bengali)",note:"A widely loved Bengali retelling of the fifteenth century."},{name:"Ramakien (Thailand) and Kakawin Ramayana (Old Javanese)",note:"Southeast Asian tellings in which the story takes on local courts and landscapes."},{name:"Jain and Buddhist Ramayanas",note:"Jain retellings such as Vimalasuri's Paumacariya and the Buddhist Dasaratha Jataka tell the story differently, with different views of Rama, Ravana and Sita."}],themes:["Dharma and duty","Exile","Loyalty","Kingship","Devotion","Justice and gender"],characters:["rama","sita","lakshmana","bharata","dasharatha","ravana","vibhishana","hanuman","valmiki","vasishtha","vishvamitra"],places:["ayodhya","nashik","hampi","rameswaram"],sources:["ram-critical","goldman-ramayana","brockington-epics","ramanujan-300","richman-many","pollock-language","narayan-retellings"],tags:["Ramayana","Itihasa","Vaishnava","Kingship"]},{slug:"mahabharata",name:"Mahabharata",native:"\u092E\u0939\u093E\u092D\u093E\u0930\u0924",iast:"Mah\u0101bh\u0101rata",roman:"II",kind:"Itihasa \xB7 Sanskrit epic",tagline:"The great war of the Bharatas, and the question of what dharma demands.",motif:"chariot",summary:"The longest epic in world literature tells of the rivalry between two branches of the Kuru family, the Pandavas and the Kauravas, culminating in the eighteen-day war at Kurukshetra. It is also an encyclopaedic text on kingship, duty, fate and the limits of righteousness.",about:["The central plot follows five Pandava brothers and their shared wife Draupadi, and their hundred cousins, the Kauravas. After the Pandavas are cheated of their kingdom at dice and spend thirteen years in exile, the dispute is settled on the battlefield of Kurukshetra. Victory brings no joy: the survivors rule over a devastated land.","Around this plot the epic gathers hundreds of tales, philosophical dialogues and teachings on law and politics, among them the Bhagavad Gita and Bhishma's long instruction in the Shanti Parva. The text describes itself as containing everything: what is found elsewhere is found here, and what is not here is found nowhere."],inTradition:["Tradition attributes the epic to Vyasa, who is also a character in it, and calls it the fifth Veda. It places the war at the end of the Dvapara Yuga, shortly before the start of the Kali Yuga. Performance traditions such as Pandavani in Chhattisgarh and the Draupadi festivals of Tamil Nadu keep the stories alive in regional forms."],inScholarship:["Scholars describe the epic as the product of centuries of composition and revision, roughly from the fourth century BCE to the fourth century CE. Some now emphasise deliberate artistry over accumulated layers (Hiltebeitel 2001). The BORI critical edition (1933\u20131966) is shorter than the traditional count of 100,000 verses.","Historians do not treat the war as a datable event. The Kuru and Panchala peoples appear in Vedic texts in the first millennium BCE and excavations at sites such as Hastinapura have been linked by some with the epic, but no archaeological identification of the war has been established."],facts:[{label:"Language",value:"Sanskrit"},{label:"Structure",value:"Eighteen books (parvas); traditionally about 100,000 verses"},{label:"Traditional author",value:"Vyasa"},{label:"Traditional setting",value:"End of the Dvapara Yuga"},{label:"Scholarly dating",value:"Roughly 400 BCE to 400 CE; layered"},{label:"Critical edition",value:"BORI, Pune, 1933\u20131966"}],structureTitle:"The eighteen parvas",structure:[{name:"Adi Parva",note:"Origins of the Kuru family and the births and youth of the Pandavas and Kauravas."},{name:"Sabha Parva",note:"The assembly hall at Indraprastha; the dice game."},{name:"Vana Parva",note:"The forest exile; many inset tales."},{name:"Virata Parva",note:"The thirteenth year in disguise."},{name:"Udyoga Parva",note:"Preparations for war; Krishna's embassy."},{name:"Bhishma Parva",note:"The first ten days of battle; the Bhagavad Gita."},{name:"Drona Parva",note:"Drona's command; the death of Abhimanyu."},{name:"Karna Parva",note:"Karna's command and fall."},{name:"Shalya Parva",note:"The last day of battle; Duryodhana's fall."},{name:"Sauptika Parva",note:"The night raid."},{name:"Stri Parva",note:"The women mourn."},{name:"Shanti Parva",note:"Bhishma's teaching on kingship and release."},{name:"Anushasana Parva",note:"More teaching; Bhishma's death."},{name:"Ashvamedhika Parva",note:"Yudhishthira's horse sacrifice."},{name:"Ashramavasika Parva",note:"The elders withdraw to the forest."},{name:"Mausala Parva",note:"The destruction of the Yadavas."},{name:"Mahaprasthanika Parva",note:"The great departure."},{name:"Svargarohana Parva",note:"The ascent to heaven."}],versions:[{name:"Northern and southern recensions",note:"Manuscripts differ; the critical edition reconstructs an older text from both."},{name:"Regional performance traditions",note:"Pandavani (Chhattisgarh), Kathakali and Koodiyattam (Kerala), and the Draupadi cult of Tamil Nadu retell parts of the story in local idioms."},{name:"Wayang (Java and Bali)",note:"Shadow-puppet theatre that adds local characters and philosophical emphasis."}],themes:["The subtlety of dharma","War and its cost","Kingship","Fate and agency","Loyalty","Justice and gender"],characters:["yudhishthira","bhima","arjuna","draupadi","karna","bhishma","duryodhana","kunti","krishna","vyasa","hanuman"],places:["kurukshetra","dwarka","mathura-vrindavan"],sources:["mbh-critical","debroy-mahabharata","vanbuitenen-mahabharata","ganguli-mahabharata","brockington-epics","hiltebeitel-rethinking","sukthankar-meaning","narayan-retellings"],tags:["Mahabharata","Itihasa","Dharma","War"]},{slug:"bhagavad-gita",name:"Bhagavad Gita",native:"\u092D\u0917\u0935\u0926\u094D\u0917\u0940\u0924\u093E",iast:"Bhagavadg\u012Bt\u0101",roman:"III",kind:"Philosophical dialogue within the Mahabharata",tagline:"A conversation on a battlefield about action, knowledge and devotion.",motif:"wheel",summary:"A dialogue of eighteen chapters between Krishna and Arjuna just before the war begins. Faced with fighting his own kin, Arjuna collapses in doubt; Krishna's reply becomes one of the most influential texts of Hindu thought.",about:["The Gita sits within the Bhishma Parva of the Mahabharata (chapters 23 to 40 in the critical edition). The dialogue is narrated by Sanjaya, who is granted divine sight, to the blind king Dhritarashtra. Arjuna asks; Krishna answers.","The text weaves together several ideas: disciplined action without clinging to results (karma yoga), knowledge of the Self (jnana), and loving devotion to God (bhakti). It also offers a vision of the cosmos in which God is both source and form of everything, climaxing in the eleventh chapter."],inTradition:["Every major Vedanta teacher has commented on the Gita. Shankara (eighth century) emphasised knowledge and renunciation; Ramanuja (eleventh century) emphasised devotion; Madhva (thirteenth century) argued for a strict difference between God and souls. Jnaneshwar's Marathi Jnaneshwari (1290) opened the text to a vernacular audience.","Modern readers have drawn different lessons. Tilak read it as a call to action; Gandhi read the battlefield as an allegory for the inner struggle and used it to support nonviolence; Aurobindo wrote a long interpretive study."],inScholarship:["Most scholars date the Gita to around 200 BCE to 200 CE and regard it as composed separately and fitted into the epic. Debates continue about whether it is a single composition and how its mixture of Upanishadic, Samkhya, yogic and devotional ideas came together (Flood 1996; Brockington 1998)."],facts:[{label:"Length",value:"18 chapters, 700 verses in the standard text"},{label:"Speakers",value:"Krishna to Arjuna; narrated by Sanjaya"},{label:"Setting",value:"Kurukshetra, before the first day of fighting"},{label:"Place in the epic",value:"Bhishma Parva (critical edition 6.23\u20136.40)"},{label:"Scholarly dating",value:"Roughly 200 BCE to 200 CE"}],structureTitle:"A traditional grouping in three sixes",structure:[{name:"Chapters 1\u20136",note:"Arjuna's despair; knowledge of the Self; action without attachment; meditation. Often called the karma-yoga section."},{name:"Chapters 7\u201312",note:"The nature of God; the cosmic form; devotion. Often called the bhakti-yoga section."},{name:"Chapters 13\u201318",note:"Field and knower; the three gunas; duty and freedom. Often called the jnana section. This three-part scheme is a traditional aid, not something the text announces."}],versions:[{name:"Shankara's commentary",note:"Reads the Gita as teaching liberation through knowledge, with action purifying the mind."},{name:"Ramanuja's commentary",note:"Reads the Gita as the teaching of devotion to a personal God."},{name:"Madhva's commentary",note:"Reads it in a dualist (Dvaita) key."},{name:"Modern readings",note:"Tilak's Gita Rahasya (action), Gandhi's Anasaktiyoga (selfless action and nonviolence), Aurobindo's Essays on the Gita."}],themes:["Duty and action","Detachment","Knowledge of the Self","Devotion","The three gunas"],characters:["arjuna","krishna","vyasa"],places:["kurukshetra"],sources:["gita-miller","gita-sargeant","radhakrishnan-moore","brockington-epics","flood-intro","mbh-critical"],tags:["Gita","Philosophy","Yoga","Mahabharata"]},{slug:"bhagavata-purana",name:"Bhagavata Purana",native:"\u092D\u093E\u0917\u0935\u0924\u092A\u0941\u0930\u093E\u0923",iast:"Bh\u0101gavatapur\u0101\u1E47a",roman:"IV",kind:"Purana",tagline:"The stories of Vishnu and his devotees, culminating in Krishna.",motif:"conch",summary:"One of the most influential of the Puranas, in twelve books. It tells of Vishnu's avatars and of devotees such as Prahlada and Dhruva, and devotes its tenth book to the life of Krishna.",about:["The Bhagavata Purana is framed as a recitation by the sage Shuka to King Parikshit, who has a week to live. Its main claim is that devotion (bhakti) is the highest path, and it offers stories as demonstrations of that claim: an elephant calls for help, a child will not give up his faith, a poor friend visits a king.","Book 10, on Krishna, is the best known and has shaped poetry, painting, dance and temple worship across India. Other books include the cosmology of the worlds, genealogies of kings, and Krishna's teachings to Uddhava in Book 11."],inTradition:["Vaishnava traditions regard it as the mature fruit of Vedic knowledge, and many consider it the foremost of the Puranas. It is recited in week-long public readings (saptaha). Gaudiya, Pushtimarg, Sri Vaishnava and other traditions have commentaries on it."],inScholarship:["Many scholars date the Bhagavata to the ninth or tenth century CE and place its composition in South India, noting the influence of Tamil Alvar devotion on its devotional poetry (Bryant 2003). Like other Puranas it is composite and was revised over time (Rocher 1986)."],facts:[{label:"Structure",value:"Twelve books (skandhas); traditionally about 18,000 verses"},{label:"Frame",value:"Shuka tells the story to King Parikshit"},{label:"Language",value:"Sanskrit"},{label:"Scholarly dating",value:"Often ninth to tenth century CE"},{label:"Famous episodes",value:"Dhruva (4), Prahlada (7), Gajendra and the churning (8), Krishna (10)"}],structureTitle:"The twelve skandhas, in brief",structure:[{name:"Skandha 1",note:"Frame story; the avatars; Parikshit and the curse."},{name:"Skandha 2",note:"Cosmic form of God; the process of creation."},{name:"Skandha 3",note:"Creation continued; Kapila teaches his mother."},{name:"Skandha 4",note:"The devotee Dhruva; the king Prithu."},{name:"Skandha 5",note:"Rishabha; cosmology."},{name:"Skandha 6",note:"Ajamila; Vritra."},{name:"Skandha 7",note:"Prahlada and Narasimha."},{name:"Skandha 8",note:"Gajendra; the churning of the ocean; Vamana."},{name:"Skandha 9",note:"Solar and lunar dynasties, including Rama's line."},{name:"Skandha 10",note:"The life of Krishna."},{name:"Skandha 11",note:"Krishna's teaching to Uddhava; the end of the Yadavas."},{name:"Skandha 12",note:"Kali Yuga; Parikshit's death; conclusion."}],versions:[{name:"Regional retellings",note:"Eknath's Marathi commentary on Book 11 and the Assamese Bhagavata associated with Sankardev show how the text travelled into vernacular literature."},{name:"Performance and painting",note:"Krishna Lila in Rajasthan, Odisha and Manipur, and Pahari and Rajput miniatures, draw heavily on Book 10."}],themes:["Devotion","Divine grace","Surrender","Divine play","Time and cosmic cycles"],characters:["krishna","vishnu","prahlada","narada","lakshmi"],places:["mathura-vrindavan","dwarka"],sources:["debroy-bhagavata","bryant-krishna","rocher-puranas","dimmitt-vanbuitenen","kinsley-divine-player","hawley-butter-thief"],tags:["Purana","Vaishnava","Bhakti","Krishna"]},{slug:"devi-mahatmya",name:"Devi Mahatmya",native:"\u0926\u0947\u0935\u0940\u092E\u093E\u0939\u093E\u0924\u094D\u092E\u094D\u092F",iast:"Dev\u012Bm\u0101h\u0101tmya",roman:"V",kind:"Purana \xB7 section of the Markandeya Purana",tagline:"The Goddess as supreme power, victorious over the forces of disorder.",motif:"sun",summary:"A 700-verse Sanskrit hymn-narrative within the Markandeya Purana that praises the Goddess as the supreme reality and tells three stories of her defeat of demons. It is the foundation of Shakta devotion and is recited during Navaratri.",about:["The Devi Mahatmya is told in three episodes. In the first, the Goddess, as the power of sleep, releases Vishnu so that he can defeat Madhu and Kaitabha. In the second, the gods' combined energies take shape as a goddess who slays the buffalo-demon Mahishasura. In the third, she overcomes Shumbha and Nishumbha, with the help of Kali and her fellow Matrikas.","Its central claim is that the many goddesses are forms of one. In the final battle other goddesses are revealed as her own powers and merge back into her, an image of the one supreme principle behind the many."],inTradition:["Also known as the Durga Saptashati or Chandi, it is recited daily by many devotees and in full during the nine nights of Navaratri. Tradition links the three episodes with the three forms Mahakali, Mahalakshmi and Mahasaraswati. Durga Puja in Bengal and the Dasara festival of Mysuru dramatise the victory over Mahishasura."],inScholarship:["Scholars date the text to around the fifth or sixth century CE and treat it as one of the earliest sustained Sanskrit theologies of the Goddess as the supreme being (Coburn 1991). It was later attached to the Markandeya Purana, in chapters 81 to 93."],facts:[{label:"Place in the Purana",value:"Markandeya Purana, chapters 81\u201393"},{label:"Length",value:"13 chapters, about 700 verses"},{label:"Frame",value:"The sage Medhas teaches a king and a merchant"},{label:"Scholarly dating",value:"Around the fifth to sixth century CE"},{label:"Recited",value:"Daily by devotees; fully during Navaratri"}],structureTitle:"The three episodes (charitras)",structure:[{name:"First episode (chapter 1)",note:"Madhu and Kaitabha: Vishnu is awakened from yogic sleep."},{name:"Middle episode (chapters 2\u20134)",note:"Mahishasura: the Goddess takes shape from the gods' energies."},{name:"Last episode (chapters 5\u201313)",note:"Shumbha and Nishumbha, including Kali and Raktabija; the blessings of the text."}],versions:[{name:"Durga Puja (Bengal)",note:"Autumn festival centred on images of the Goddess slaying Mahishasura."},{name:"Dasara at Mysuru",note:"A royal festival at which the goddess Chamundeshwari is honoured."},{name:"Navaratri in Gujarat",note:"Nine nights of devotional dance, honouring the Goddess."}],themes:["Divine feminine power","Cosmic order","Delusion and knowledge","Unity of many goddesses"],characters:["brahma","vishnu","parvati","saraswati"],places:["kamakhya","kanyakumari"],sources:["coburn-encountering","kinsley-goddesses","hawley-wulff","rocher-puranas","dimmitt-vanbuitenen"],tags:["Shakta","Purana","Goddess","Navaratri"]}]});var Qi,Ji,Gh=Ga(()=>{Qi=[{slug:"rama",name:"Rama",native:"\u0930\u093E\u092E",iast:"R\u0101ma",category:"character",summary:"Prince of Ayodhya and hero of the Ramayana, honoured by many Hindus as an avatar of Vishnu and as a model of dutiful kingship.",body:["Rama is the eldest son of King Dasharatha. He accepts fourteen years of exile to keep his father's word, loses Sita to Ravana, defeats Ravana with the help of Hanuman and the vanara army, and returns to rule Ayodhya. In the Valmiki Ramayana he is introduced as a man of exemplary qualities whose divinity becomes clearer as the story proceeds.","The Ramayana leaves open hard questions about his conduct, among them the killing of Vali and the treatment of Sita after the war. Different tellings answer those questions differently."],inTradition:["Rama is called Maryada Purushottama, the ideal man who upholds limits. Rama Navami marks his birth, and the annual Ramlila performances re-enact his life across northern India. The Ramanandi order is devoted to him."],inScholarship:["Pollock (2006) argues that the Ramayana's Rama became a model of kingship that rulers across South and Southeast Asia sought to emulate. Ramanujan (1991) shows how the figure changes between Hindu, Jain and Buddhist retellings."],tags:["Ramayana","Vaishnava","Avatar","Kingship"],motif:"bow",related:["sita","lakshmana","hanuman","ravana","vishnu","ayodhya","ramayana"],appearsIn:[{epic:"ramayana",chapter:"birth-and-bow"},{epic:"ramayana",chapter:"the-exile"},{epic:"ramayana",chapter:"the-war-for-lanka"}],sources:["ram-critical","goldman-ramayana","pollock-language","ramanujan-300"]},{slug:"sita",name:"Sita",native:"\u0938\u0940\u0924\u093E",iast:"S\u012Bt\u0101",category:"character",summary:"Daughter of the earth and wife of Rama, whose endurance and self-respect make her one of the most retold figures in South Asian literature.",body:['King Janaka finds Sita in a furrow while ploughing, and the name means "furrow". She goes with Rama into exile, is abducted by Ravana, refuses to leave Lanka with Hanuman because Rama must come for her, and undergoes a trial by fire after the war. In the Uttara Kanda she is exiled and, vindicating herself before the assembly, is received back by the earth.',"Later tradition identifies her as an incarnation of Lakshmi, though the core Ramayana does not describe her so."],inTradition:["Her epithets include Janaki, Maithili and Vaidehi. She is honoured at Janakpur in Nepal and at Sitamarhi in Bihar, and on Sita Navami. In many homes she is the model of fidelity; others emphasise her strength in refusing to be rescued by anyone other than Rama."],inScholarship:["Retellings in Telugu, Bengali and other languages, many by women, tell the story from Sita's side or end it before the exile (Richman 1991; Ramanujan 1991)."],tags:["Ramayana","Fidelity","Earth","Mithila"],motif:"lotus",related:["rama","hanuman","ravana","lakshmi","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-golden-deer"},{epic:"ramayana",chapter:"leap-across-the-ocean"},{epic:"ramayana",chapter:"rule-doubt-and-departure"}],sources:["goldman-ramayana","richman-many","ramanujan-300"]},{slug:"lakshmana",name:"Lakshmana",native:"\u0932\u0915\u094D\u0937\u094D\u092E\u0923",iast:"Lak\u1E63ma\u1E47a",category:"character",summary:"Rama's younger brother, who follows him into exile and serves him with total loyalty.",body:["Lakshmana, son of Sumitra, is inseparable from Rama. In the forest he guards the hermitage, mutilates Shurpanakha, and is left to protect Sita on the day she is abducted. He kills Ravana's son Indrajit in the war and is saved by the healing herbs Hanuman brings.","He is known for a quick temper as well as devotion. Tradition regards him as an incarnation of the serpent Shesha, who is Vishnu's couch."],tags:["Ramayana","Loyalty","Brotherhood"],motif:"bow",related:["rama","sita","hanuman","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-golden-deer"}],sources:["goldman-ramayana","mani-puranic"]},{slug:"bharata",name:"Bharata",native:"\u092D\u0930\u0924",iast:"Bharata",category:"character",summary:"Rama's brother, son of Kaikeyi, who refuses the throne his mother won for him.",body:["On returning from his mother's home Bharata finds his father dead and his brother exiled because of his own mother. He rejects the throne and goes into the forest to bring Rama back. When Rama refuses, Bharata takes his sandals, places them on the throne, and governs in Rama's name from a village outside the city.","Many retellings present him as the ideal of renunciation: someone who has everything offered to him and refuses it out of love."],tags:["Ramayana","Renunciation","Brotherhood"],motif:"tree",related:["rama","dasharatha","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-exile"}],sources:["goldman-ramayana"]},{slug:"dasharatha",name:"Dasharatha",native:"\u0926\u0936\u0930\u0925",iast:"Da\u015Baratha",category:"character",summary:"King of Kosala and father of Rama, bound by a promise that destroys him.",body:["Dasharatha has three wives and, after a great sacrifice, four sons. Years earlier he had granted Kaikeyi two boons. When she calls them in on the eve of Rama's coronation, he cannot refuse. He dies of grief soon after Rama leaves.","His story is often read as a study in how a king's word, even one given affectionately, can become a tragedy."],tags:["Ramayana","Kingship","Promises"],motif:"sun",related:["rama","bharata","ayodhya","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-exile"}],sources:["goldman-ramayana"]},{slug:"ravana",name:"Ravana",native:"\u0930\u093E\u0935\u0923",iast:"R\u0101va\u1E47a",category:"character",summary:"The ten-headed king of Lanka who abducts Sita; a tyrant in the Valmiki text, and in many later tellings also a scholar and devotee of Shiva.",body:["Ravana wins a boon from Brahma that protects him from gods and demons, but not from humans. He seizes Sita and refuses to return her, even when his brother Vibhishana and wife Mandodari urge him to. Rama kills him in battle.","Valmiki's Ravana is formidable and learned but cruel. Many later traditions emphasise his learning and devotion to Shiva, and some communities honour him instead of burning his effigy at Dussehra."],inScholarship:["Retellings from Tamil, Jain and Southeast Asian traditions treat Ravana in varied ways, from villain to tragic hero, a good illustration of Ramanujan's point that there are many Ramayanas (Ramanujan 1991)."],tags:["Ramayana","Antagonist","Shaiva","Lanka"],motif:"mace",related:["rama","sita","vibhishana","shiva","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-golden-deer"},{epic:"ramayana",chapter:"the-war-for-lanka"}],sources:["goldman-ramayana","ramanujan-300","richman-many"]},{slug:"vibhishana",name:"Vibhishana",native:"\u0935\u093F\u092D\u0940\u0937\u0923",iast:"Vibh\u012B\u1E63a\u1E47a",category:"character",summary:"Ravana's righteous brother, who leaves Lanka and is crowned its king after the war.",body:["Vibhishana advises Ravana to return Sita. When Ravana scorns him, he joins Rama, whose council debates whether to trust him. Rama accepts, and after Ravana's death crowns him king of Lanka.","A tradition of the Srirangam temple says he carried the image of Ranganatha toward Lanka and that it would not move from where he set it down, which is why it stands there."],tags:["Ramayana","Righteousness","Lanka"],motif:"conch",related:["rama","ravana","ramayana"],appearsIn:[{epic:"ramayana",chapter:"the-war-for-lanka"}],sources:["goldman-ramayana","mani-puranic"]},{slug:"arjuna",name:"Arjuna",native:"\u0905\u0930\u094D\u091C\u0941\u0928",iast:"Arjuna",category:"character",summary:"The third Pandava, a peerless archer and the friend and student of Krishna, to whom the Gita is addressed.",body:["Arjuna is the son of Kunti and Indra. He wins Draupadi at her svayamvara, earns divine weapons from Shiva and Indra, lives as the dance teacher Brihannala at Virata's court, and is the Pandava champion at Kurukshetra. At the start of the war he collapses in doubt and Krishna answers him with the Bhagavad Gita.","His son Abhimanyu is killed on the thirteenth day of the war, and his grandson Parikshit continues the line after the Pandavas leave."],tags:["Mahabharata","Warrior","Gita"],motif:"bow",related:["krishna","yudhishthira","draupadi","bhagavad-gita","mahabharata"],appearsIn:[{epic:"bhagavad-gita",chapter:"arjuna-despairs"},{epic:"mahabharata",chapter:"a-year-in-disguise"}],sources:["mbh-critical","debroy-mahabharata","gita-miller"]},{slug:"yudhishthira",name:"Yudhishthira",native:"\u092F\u0941\u0927\u093F\u0937\u094D\u0920\u093F\u0930",iast:"Yudhi\u1E63\u1E6Dhira",category:"character",summary:"The eldest Pandava, called Dharmaraja, whose commitment to truth and dharma is tested throughout the epic.",body:["Son of Kunti and Dharma, Yudhishthira is known for truthfulness and for his inability to refuse a challenge: he loses everything at dice. He answers the Yaksha's questions in the forest, tells the half-truth that leads to Drona's death, and rules after the war with deep remorse.","At the end of the epic he refuses to enter heaven without the dog that has followed him. The dog is Dharma in disguise."],inScholarship:["Hiltebeitel (2001) reads the epic as the education of Yudhishthira, a king who learns that dharma is subtle and cannot be reduced to rules."],tags:["Mahabharata","Dharma","Kingship"],motif:"dice",related:["arjuna","bhima","draupadi","krishna","dharma","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-dice-game"},{epic:"mahabharata",chapter:"years-in-the-forest"},{epic:"mahabharata",chapter:"after-the-war"}],sources:["mbh-critical","hiltebeitel-rethinking","debroy-mahabharata"]},{slug:"bhima",name:"Bhima",native:"\u092D\u0940\u092E",iast:"Bh\u012Bma",category:"character",summary:"The second Pandava, famed for strength and appetite, who keeps the vows made in anger.",body:["Bhima, son of Kunti and Vayu, is the strongest of the brothers. He kills the rakshasa Hidimba, the general Kichaka, and, fulfilling his vow after the dice game, Dushasana. In the forest he meets his half-brother Hanuman.","At the end of the war he breaks Duryodhana's thigh with his mace, an act many characters in the epic condemn."],tags:["Mahabharata","Strength","Warrior"],motif:"mace",related:["hanuman","draupadi","yudhishthira","duryodhana","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"years-in-the-forest"}],sources:["mbh-critical","debroy-mahabharata"]},{slug:"draupadi",name:"Draupadi",native:"\u0926\u094D\u0930\u094C\u092A\u0926\u0940",iast:"Draupad\u012B",category:"character",summary:"Wife of the five Pandavas, born from the sacrificial fire, whose humiliation at the dice game drives the epic's moral questions.",body:["Draupadi, also called Panchali and Yajnaseni, is born from fire as the daughter of King Drupada. She is won by Arjuna at her svayamvara and becomes the wife of all five brothers. In the assembly hall she asks the question that no one can answer and is saved from disrobing. She hardly forgives and wishes to see her insult avenged.","In Tamil Nadu she is the centre of a living cult, with annual festivals in which parts of the Mahabharata are performed. In some of them her loosened hair, left unbound since the insult in the hall, is tied up again once the battle has been enacted (Hiltebeitel 1988, 1991)."],inScholarship:["Hiltebeitel's study of the Draupadi cult shows how a heroine of the epic became a regional goddess. Modern retellings, such as Pratibha Ray's Odia novel Yajnaseni, tell the story from her point of view."],tags:["Mahabharata","Goddess","Justice and gender"],motif:"flame",related:["yudhishthira","arjuna","bhima","krishna","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-dice-game"},{epic:"mahabharata",chapter:"a-year-in-disguise"}],sources:["mbh-critical","hiltebeitel-rethinking","hiltebeitel-draupadi","debroy-mahabharata"]},{slug:"karna",name:"Karna",native:"\u0915\u0930\u094D\u0923",iast:"Kar\u1E47a",category:"character",summary:"Kunti's eldest son, raised by a charioteer, who fights for Duryodhana against his own brothers.",body:["Born to Kunti and the sun god before her marriage, Karna is set adrift and raised by a charioteer and his wife. He is born with a natural armour and earrings, which he gives to Indra in disguise. Duryodhana befriends and honours him, and Karna remains loyal even after learning that the Pandavas are his brothers.","He falls to Arjuna on the seventeenth day of battle. In the text he is by turns generous, proud, and implicated in Draupadi's humiliation, a complexity that has made him one of the epic's most discussed figures."],inScholarship:["Modern Indian literature has embraced Karna as a tragic figure; Shivaji Sawant's Marathi novel Mrityunjaya (1967) is a well-known example. The critical text's Karna is less sentimental than many modern retellings."],tags:["Mahabharata","Loyalty","Tragedy"],motif:"sun",related:["kunti","duryodhana","arjuna","krishna","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-failed-embassy"},{epic:"mahabharata",chapter:"eighteen-days"}],sources:["mbh-critical","debroy-mahabharata"]},{slug:"bhishma",name:"Bhishma",native:"\u092D\u0940\u0937\u094D\u092E",iast:"Bh\u012B\u1E63ma",category:"character",summary:"The patriarch of the Kuru house, who vows celibacy and lifelong service to the throne, and teaches Yudhishthira from his bed of arrows.",body:["Born Devavrata to Shantanu and Ganga, he renounces the throne and marriage so that his father can marry Satyavati. As Bhishma he serves each ruler in turn, loyal to the throne rather than to any claimant. He commands the Kaurava army for ten days and is brought down by Arjuna.","Lying on a bed of arrows, he teaches Yudhishthira about the duties of a king and about the paths to release in the Shanti and Anushasana Parvas. The Vishnu Sahasranama is spoken by him in the epic."],tags:["Mahabharata","Vows","Teacher"],motif:"bow",related:["yudhishthira","arjuna","duryodhana","vyasa","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-kuru-house"},{epic:"mahabharata",chapter:"the-battlefield-opens"}],sources:["mbh-critical","debroy-mahabharata"]},{slug:"duryodhana",name:"Duryodhana",native:"\u0926\u0941\u0930\u094D\u092F\u094B\u0927\u0928",iast:"Duryodhana",category:"character",summary:"Eldest of the hundred Kaurava brothers, whose jealousy and refusal to share the kingdom lead to the war.",body:["Duryodhana is the son of Dhritarashtra and Gandhari. He tries to burn the Pandavas in the house of lacquer, wins their kingdom at dice by Shakuni's cheating, and refuses Krishna's embassy. He fights on to the last day and is struck down by Bhima.","He is a villain of the epic, but also a capable king, a generous friend to Karna, and a warrior who dies a warrior's death. A temple dedicated to him, the Malanada, exists in Kerala."],tags:["Mahabharata","Antagonist","Kingship"],motif:"mace",related:["karna","bhima","yudhishthira","krishna","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-dice-game"},{epic:"mahabharata",chapter:"eighteen-days"}],sources:["mbh-critical","debroy-mahabharata"]},{slug:"kunti",name:"Kunti",native:"\u0915\u0941\u0928\u094D\u0924\u0940",iast:"Kunt\u012B",category:"character",summary:"Mother of Karna and of three Pandavas, aunt of Krishna, and a figure of long endurance.",body:["Kunti, also called Pritha, is the sister of Vasudeva and so Krishna's aunt. From the sage Durvasa she learns a mantra that calls a god to give her a child. She uses it before marriage, bearing Karna to the sun god, and later for Yudhishthira, Bhima and Arjuna. She is widowed young and raises all five Pandavas.","She appeals to Karna to join his brothers before the war, to no avail. In the Bhagavata Purana (1.8) she is the speaker of a famous prayer asking Krishna for continual hardships, so that she never forgets him."],tags:["Mahabharata","Motherhood","Endurance"],motif:"lotus",related:["karna","krishna","arjuna","yudhishthira","mahabharata"],appearsIn:[{epic:"mahabharata",chapter:"the-kuru-house"},{epic:"mahabharata",chapter:"the-failed-embassy"}],sources:["mbh-critical","debroy-mahabharata","debroy-bhagavata"]},{slug:"prahlada",name:"Prahlada",native:"\u092A\u094D\u0930\u0939\u094D\u0932\u093E\u0926",iast:"Prahl\u0101da",category:"character",summary:"The child devotee of Vishnu who defies his tyrant father, the asura king Hiranyakashipu.",body:["Born into an asura family, Prahlada is devoted to Vishnu from childhood. He survives every attempt on his life, and Vishnu, as the man-lion Narasimha, kills his father to protect him. He then rules as a just king.","The Bhagavata Purana (6.3) counts him among the twelve great authorities on devotion, and his story is one of the most retold in the Puranic literature."],tags:["Purana","Devotion","Vaishnava"],motif:"flame",related:["vishnu","bhakti","bhagavata-purana"],appearsIn:[{epic:"bhagavata-purana",chapter:"prahlada"}],sources:["debroy-bhagavata","dimmitt-vanbuitenen"]}],Ji=[{slug:"vyasa",name:"Vyasa",native:"\u0935\u094D\u092F\u093E\u0938",iast:"Vy\u0101sa",category:"sage",summary:"The traditional compiler of the Vedas and author of the Mahabharata, and a character within it.",body:['Krishna Dvaipayana, called Vyasa, "the arranger", is the son of Satyavati and the sage Parashara. Tradition credits him with dividing the Veda into its four collections, composing the Mahabharata and the Puranas, and teaching these to his disciples. In the epic he fathers Dhritarashtra, Pandu and Vidura and counsels the Pandavas.'],inTradition:["Guru Purnima, also called Vyasa Purnima, honours him as the archetypal teacher. Tradition also ascribes the Brahma Sutras to a Badarayana whom it identifies with Vyasa."],inScholarship:['Scholars treat Vyasa as a role or title, "the arranger", not as a single historical author. The epic as we have it is the work of many hands over centuries (Brockington 1998).'],tags:["Sage","Mahabharata","Compiler"],motif:"flame",related:["ganesha","bhishma","mahabharata","bhagavata-purana"],appearsIn:[{epic:"mahabharata",chapter:"the-kuru-house"}],sources:["mbh-critical","brockington-epics","rocher-puranas"]},{slug:"valmiki",name:"Valmiki",native:"\u0935\u093E\u0932\u094D\u092E\u0940\u0915\u093F",iast:"V\u0101lm\u012Bki",category:"sage",summary:"The traditional author of the Sanskrit Ramayana, called the Adi Kavi, the first poet.",body:["In the first book of the Ramayana, Valmiki sees a hunter kill one of a pair of birds. His grief takes the form of a metrical verse, the first shloka, and Brahma tells him to compose the story of Rama in that metre. In the Uttara Kanda he gives shelter to Sita and teaches her sons Lava and Kusha the epic."],inTradition:["The Valmiki community and many others honour him on Valmiki Jayanti. The popular story that he was once a bandit called Ratnakara belongs to later retellings, not to the Ramayana itself."],tags:["Sage","Ramayana","Poet"],motif:"flame",related:["sita","rama","narada","ramayana"],appearsIn:[{epic:"ramayana",chapter:"rule-doubt-and-departure"}],sources:["ram-critical","goldman-ramayana","brockington-epics"]},{slug:"narada",name:"Narada",native:"\u0928\u093E\u0930\u0926",iast:"N\u0101rada",category:"sage",summary:"The wandering divine sage, devotee of Vishnu and carrier of news between the worlds.",body:["Narada travels with his veena between heaven, earth and the lower worlds, singing the name of Vishnu and bringing news that often sets stories in motion. In the Ramayana's first book it is Narada who gives Valmiki the summary of Rama's story. In the Bhagavata Purana he teaches Dhruva and Prahlada."],inTradition:["Puranic tradition calls him a mind-born son of Brahma. The Narada Bhakti Sutra, a short text on devotion, is attributed to him, though it is a later work."],tags:["Sage","Devotion","Messenger"],motif:"veena",related:["brahma","vishnu","valmiki","bhagavata-purana"],sources:["dimmitt-vanbuitenen","goldman-ramayana","mani-puranic"]},{slug:"vasishtha",name:"Vasishtha",native:"\u0935\u0938\u093F\u0937\u094D\u0920",iast:"Vasi\u1E63\u1E6Dha",category:"sage",summary:"One of the seven great sages, family priest and teacher of the Ikshvaku kings, including Rama.",body:["The Rigveda's seventh book is traditionally ascribed to the Vasishtha family of poets. In the Ramayana he is the preceptor of Dasharatha and instructs Rama; his rivalry with Vishvamitra, over the wish-granting cow Nandini and other matters, is told in the first book."],tags:["Sage","Ramayana","Vedic"],motif:"sun",related:["vishvamitra","rama","dasharatha","ramayana"],appearsIn:[{epic:"ramayana",chapter:"birth-and-bow"}],sources:["rigveda-jb","goldman-ramayana"]},{slug:"vishvamitra",name:"Vishvamitra",native:"\u0935\u093F\u0936\u094D\u0935\u093E\u09
